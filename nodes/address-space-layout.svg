<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">A process address space is ordered by region, permission, and growth direction</title>
  <desc id="desc">One private virtual address column runs from the unmapped null page at address zero through read-execute text, read-write data, an upward-growing read-write heap, unmapped slack around a memory-mapped region, and a downward-growing read-write stack near the highest addresses. Heap and stack grow toward the middle. No writable region is executable. Exact starts may move under ASLR, but order and permissions remain.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 15px; fill: #536B7E; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #536B7E; }
      .stack { fill: #FBE3DD; stroke: #D85A30; stroke-width: 2; }
      .mmap { fill: #EEE4FA; stroke: #7A5CB0; stroke-width: 2; }
      .heap { fill: #FFF1C7; stroke: #D89016; stroke-width: 2.5; }
      .data { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 2; }
      .textseg { fill: #DDEAFF; stroke: #3977B8; stroke-width: 2; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
      .growth { fill: none; stroke: #D89016; stroke-width: 4; marker-end: url(#arrow); }
    </style>
    <pattern id="gap" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#F7F8F9"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#D6DDE2" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#D89016"/>
    </marker>
    <marker id="axis-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#7B8D9B"/>
    </marker>
  </defs>

  <rect width="720" height="720" fill="#FFFFFF"/>
  <text x="28" y="42" class="headline">Address space: ordered regions, separate permissions</text>
  <text x="28" y="70" class="subtitle">One process's private virtual map · schematic, not to scale</text>

  <path d="M104 683 V110" fill="none" stroke="#7B8D9B" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="104" y="100" text-anchor="middle" class="small">higher addresses</text>
  <text x="104" y="706" text-anchor="middle" class="small">lower addresses</text>

  <g aria-label="Ordered virtual address regions from high to low">
    <text x="195" y="135" text-anchor="end" class="mono">0x7fff…</text>
    <rect x="220" y="115" width="300" height="90" class="stack"/>
    <text x="240" y="143" class="label">STACK</text>
    <text x="240" y="168" class="small">call frames · locals · return addresses</text>
    <text x="500" y="193" text-anchor="end" class="stage">R + W · not X</text>

    <rect x="220" y="205" width="300" height="100" fill="url(#gap)" stroke="#B3BEC6" stroke-width="1.5"/>
    <text x="240" y="229" class="small">unmapped slack</text>

    <text x="195" y="326" text-anchor="end" class="mono">0x7f…</text>
    <rect x="220" y="305" width="300" height="70" class="mmap"/>
    <text x="240" y="332" class="label">MEMORY-MAPPED</text>
    <text x="240" y="358" class="small">library code R+X · mapped data R+W</text>

    <rect x="220" y="375" width="300" height="80" fill="url(#gap)" stroke="#B3BEC6" stroke-width="1.5"/>
    <text x="240" y="400" class="small">unmapped slack</text>

    <text x="195" y="477" text-anchor="end" class="mono">0x602000</text>
    <rect x="220" y="455" width="300" height="70" class="heap"/>
    <text x="240" y="483" class="label">HEAP</text>
    <text x="240" y="508" class="small">run-time allocations · malloc / brk</text>
    <text x="500" y="483" text-anchor="end" class="stage">R + W · not X</text>

    <text x="195" y="548" text-anchor="end" class="mono">0x601000</text>
    <rect x="220" y="525" width="300" height="55" class="data"/>
    <text x="240" y="558" class="label">DATA + BSS</text>
    <text x="500" y="558" text-anchor="end" class="stage">R + W · not X</text>

    <text x="195" y="605" text-anchor="end" class="mono">0x400000</text>
    <rect x="220" y="580" width="300" height="65" class="textseg"/>
    <text x="240" y="610" class="label">TEXT · PROGRAM CODE</text>
    <text x="500" y="632" text-anchor="end" class="stage">R + X · not W</text>

    <text x="195" y="675" text-anchor="end" class="mono">0x0</text>
    <rect x="220" y="645" width="300" height="45" fill="url(#gap)" stroke="#7B8D9B" stroke-width="2"/>
    <text x="240" y="674" class="label">NULL PAGE · UNMAPPED · FAULTS</text>
  </g>

  <path d="M370 205 V270" class="growth"/>
  <text x="540" y="149" class="stage">STACK GROWS ↓</text>
  <text x="540" y="173" class="small">new frames use</text>
  <text x="540" y="194" class="small">lower addresses</text>

  <path d="M370 455 V410" class="growth"/>
  <text x="540" y="463" class="stage">HEAP GROWS ↑</text>
  <text x="540" y="487" class="small">allocations use</text>
  <text x="540" y="508" class="small">higher addresses</text>

  <rect x="540" y="230" width="152" height="102" rx="10" class="neutral"/>
  <text x="616" y="257" text-anchor="middle" class="stage">SECURITY WALL</text>
  <text x="616" y="282" text-anchor="middle" class="small">code: R+X</text>
  <text x="616" y="304" text-anchor="middle" class="small">data: R+W</text>
  <text x="616" y="326" text-anchor="middle" class="label">never W+X</text>

  <rect x="540" y="354" width="152" height="78" rx="10" class="neutral"/>
  <text x="616" y="380" text-anchor="middle" class="stage">ASLR</text>
  <text x="616" y="403" text-anchor="middle" class="small">moves exact starts,</text>
  <text x="616" y="424" text-anchor="middle" class="small">not order or rights</text>
</svg>
