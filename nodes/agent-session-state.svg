<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Agent session state separates run, session, and memory lifecycles</title>
  <desc id="desc">Two fresh turn runs exchange only visible conversation state through a session store. Their temporary execution records end independently, while selected durable facts move to agent memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#45627a"/></marker>
    <style>
      .bg{fill:#f7f9fc}.run{fill:#e8f1ff;stroke:#3973b7;stroke-width:2}.session{fill:#eaf8ef;stroke:#328254;stroke-width:2}.memory{fill:#fff4dc;stroke:#b87816;stroke-width:2}.muted{fill:#f0f2f5;stroke:#88939d;stroke-width:1.5;stroke-dasharray:6 5}.h{font:700 22px system-ui,sans-serif;fill:#17212b}.t{font:16px system-ui,sans-serif;fill:#263746}.s{font:14px system-ui,sans-serif;fill:#526271}.line{stroke:#45627a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="960" height="500" rx="20"/>
  <text class="h" x="480" y="38" text-anchor="middle">A new turn inherits meaning, not execution position</text>

  <rect class="run" x="50" y="90" width="245" height="170" rx="16"/>
  <text class="h" x="172" y="124" text-anchor="middle">Run R1</text>
  <text class="t" x="75" y="158">Input: “Where is order 4471?”</text>
  <text class="t" x="75" y="188">Lookup → final answer</text>
  <text class="s" x="75" y="222">steps · tool results · retries</text>
  <text class="s" x="75" y="244">close when turn 1 ends</text>

  <rect class="session" x="355" y="90" width="250" height="260" rx="16"/>
  <text class="h" x="480" y="124" text-anchor="middle">Session S7</text>
  <text class="t" x="380" y="160">ordered visible messages</text>
  <text class="t" x="380" y="190">current_order = 4471</text>
  <path d="M380 212 H580" stroke="#328254"/>
  <text class="s" x="380" y="242">loaded before each turn</text>
  <text class="s" x="380" y="268">new visible items appended</text>
  <text class="s" x="380" y="294">no completed-step flags</text>
  <text class="s" x="380" y="320">retention is session-scoped</text>

  <rect class="run" x="665" y="90" width="245" height="170" rx="16"/>
  <text class="h" x="787" y="124" text-anchor="middle">Fresh run R2</text>
  <text class="t" x="690" y="158">Input: “Has that arrived yet?”</text>
  <text class="t" x="690" y="188">Fresh lookup → new answer</text>
  <text class="s" x="690" y="222">empty completed-step set</text>
  <text class="s" x="690" y="244">close when turn 2 ends</text>

  <path class="line" d="M295 175 H345"/>
  <path class="line" d="M605 175 H655"/>
  <text class="s" x="320" y="162" text-anchor="middle">commit</text>
  <text class="s" x="630" y="162" text-anchor="middle">load</text>

  <rect class="muted" x="50" y="300" width="245" height="105" rx="14"/>
  <text class="t" x="172" y="332" text-anchor="middle">R1 trace</text>
  <text class="s" x="75" y="360">internal tool activity stays here</text>
  <text class="s" x="75" y="384">not in the next model history</text>
  <path class="line" d="M172 260 V290"/>

  <rect class="memory" x="665" y="300" width="245" height="105" rx="14"/>
  <text class="t" x="787" y="332" text-anchor="middle">Agent memory</text>
  <text class="s" x="690" y="360">only deliberately selected facts</text>
  <text class="s" x="690" y="384">survive across sessions</text>
  <path class="line" d="M605 318 H655"/>
  <text class="s" x="630" y="306" text-anchor="middle">promote</text>

  <text class="t" x="480" y="458" text-anchor="middle">Run state: one execution · Session state: one conversation · Memory: selected cross-session facts</text>
</svg>
