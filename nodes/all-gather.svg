<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="'Iowan Old Style',Palatino,Georgia,serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg{fill:#FBFAF7}
      .title{fill:#1B1A17;font-size:16px;font-weight:600}
      .sub{fill:#5A564E;font-size:11.5px;font-style:italic;font-family:sans-serif}
      .rowlab{fill:#8A857C;font-size:11px;font-family:sans-serif;font-style:italic}
      .rank{fill:#8A857C;font-size:11px;font-family:sans-serif}
      .cap{fill:#5A564E;font-size:12.5px;font-family:sans-serif}
      .lbl{font-size:15px;font-weight:600;font-family:sans-serif}
      .sub-l{font-size:11px;font-weight:600;font-family:sans-serif}
      .host{fill:#B8B3AA;fill-opacity:0.06;stroke:#C9C4BB;stroke-width:1}
      .combine{fill:#5A564E;fill-opacity:0.05;stroke:#B0ABA2;stroke-width:1}
      .clab{fill:#8A857C;font-size:11px;font-family:sans-serif;letter-spacing:1px}
      .fan{stroke:#8A857C;stroke-width:1.5;fill:none;opacity:0.5}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="420" rx="6"/>

  <text class="title" x="32" y="30">All-gather</text>
  <text class="sub" x="128" y="30">like gather, but every process gets the full collection  ·  all → all, no compute</text>

  <!-- before: each process holds its own chunk -->
  <text class="rowlab" x="32" y="92">before</text>
  <rect x="68"  y="70" width="84" height="40" rx="6" fill="#534AB7" fill-opacity="0.14" stroke="#534AB7" stroke-width="1.2"/>
  <rect x="228" y="70" width="84" height="40" rx="6" fill="#1D9E75" fill-opacity="0.14" stroke="#1D9E75" stroke-width="1.2"/>
  <rect x="388" y="70" width="84" height="40" rx="6" fill="#D85A30" fill-opacity="0.14" stroke="#D85A30" stroke-width="1.2"/>
  <rect x="548" y="70" width="84" height="40" rx="6" fill="#D4537E" fill-opacity="0.14" stroke="#D4537E" stroke-width="1.2"/>
  <text class="lbl" x="110" y="95" text-anchor="middle" fill="#534AB7">A</text>
  <text class="lbl" x="270" y="95" text-anchor="middle" fill="#1D9E75">B</text>
  <text class="lbl" x="430" y="95" text-anchor="middle" fill="#D85A30">C</text>
  <text class="lbl" x="590" y="95" text-anchor="middle" fill="#D4537E">D</text>
  <text class="rank" x="110" y="126" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="126" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="126" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="126" text-anchor="middle">P3</text>

  <!-- converge on the collect box (color-matched) -->
  <path d="M110 112 C 160 140, 270 150, 300 196" fill="none" stroke="#534AB7" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>
  <path d="M270 112 C 300 140, 320 150, 326 196" fill="none" stroke="#1D9E75" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>
  <path d="M430 112 C 400 140, 360 150, 354 196" fill="none" stroke="#D85A30" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>
  <path d="M590 112 C 540 140, 410 150, 380 196" fill="none" stroke="#D4537E" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>

  <!-- collect box: the full buffer A B C D -->
  <text class="clab" x="340" y="184" text-anchor="middle">collect</text>
  <rect class="combine" x="270" y="196" width="140" height="42" rx="8"/>
  <rect x="278" y="203" width="28" height="28" rx="3" fill="#534AB7" fill-opacity="0.20" stroke="#534AB7"/>
  <rect x="310" y="203" width="28" height="28" rx="3" fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75"/>
  <rect x="342" y="203" width="28" height="28" rx="3" fill="#D85A30" fill-opacity="0.20" stroke="#D85A30"/>
  <rect x="374" y="203" width="28" height="28" rx="3" fill="#D4537E" fill-opacity="0.20" stroke="#D4537E"/>
  <text class="sub-l" x="292" y="218" text-anchor="middle" fill="#534AB7">A</text>
  <text class="sub-l" x="324" y="218" text-anchor="middle" fill="#1D9E75">B</text>
  <text class="sub-l" x="356" y="218" text-anchor="middle" fill="#D85A30">C</text>
  <text class="sub-l" x="388" y="218" text-anchor="middle" fill="#D4537E">D</text>

  <!-- fan the whole buffer out to every process (neutral: carries all colors) -->
  <path class="fan" d="M300 240 C 220 276, 150 286, 110 296" marker-end="url(#ah)"/>
  <path class="fan" d="M322 240 C 305 268, 290 285, 274 296" marker-end="url(#ah)"/>
  <path class="fan" d="M358 240 C 375 268, 392 285, 426 296" marker-end="url(#ah)"/>
  <path class="fan" d="M380 240 C 460 276, 540 286, 586 296" marker-end="url(#ah)"/>

  <!-- after: every process holds the full collection -->
  <text class="rowlab" x="32" y="320">after</text>
  <!-- P0 -->
  <rect class="host" x="52"  y="298" width="116" height="40" rx="6"/>
  <rect x="59"  y="305" width="24" height="26" rx="3" fill="#534AB7" fill-opacity="0.20" stroke="#534AB7"/>
  <rect x="85"  y="305" width="24" height="26" rx="3" fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75"/>
  <rect x="111" y="305" width="24" height="26" rx="3" fill="#D85A30" fill-opacity="0.20" stroke="#D85A30"/>
  <rect x="137" y="305" width="24" height="26" rx="3" fill="#D4537E" fill-opacity="0.20" stroke="#D4537E"/>
  <!-- P1 -->
  <rect class="host" x="212" y="298" width="116" height="40" rx="6"/>
  <rect x="219" y="305" width="24" height="26" rx="3" fill="#534AB7" fill-opacity="0.20" stroke="#534AB7"/>
  <rect x="245" y="305" width="24" height="26" rx="3" fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75"/>
  <rect x="271" y="305" width="24" height="26" rx="3" fill="#D85A30" fill-opacity="0.20" stroke="#D85A30"/>
  <rect x="297" y="305" width="24" height="26" rx="3" fill="#D4537E" fill-opacity="0.20" stroke="#D4537E"/>
  <!-- P2 -->
  <rect class="host" x="372" y="298" width="116" height="40" rx="6"/>
  <rect x="379" y="305" width="24" height="26" rx="3" fill="#534AB7" fill-opacity="0.20" stroke="#534AB7"/>
  <rect x="405" y="305" width="24" height="26" rx="3" fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75"/>
  <rect x="431" y="305" width="24" height="26" rx="3" fill="#D85A30" fill-opacity="0.20" stroke="#D85A30"/>
  <rect x="457" y="305" width="24" height="26" rx="3" fill="#D4537E" fill-opacity="0.20" stroke="#D4537E"/>
  <!-- P3 -->
  <rect class="host" x="532" y="298" width="116" height="40" rx="6"/>
  <rect x="539" y="305" width="24" height="26" rx="3" fill="#534AB7" fill-opacity="0.20" stroke="#534AB7"/>
  <rect x="565" y="305" width="24" height="26" rx="3" fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75"/>
  <rect x="591" y="305" width="24" height="26" rx="3" fill="#D85A30" fill-opacity="0.20" stroke="#D85A30"/>
  <rect x="617" y="305" width="24" height="26" rx="3" fill="#D4537E" fill-opacity="0.20" stroke="#D4537E"/>
  <!-- after-row packet labels -->
  <text class="sub-l" x="71"  y="322" text-anchor="middle" fill="#534AB7">A</text>
  <text class="sub-l" x="97"  y="322" text-anchor="middle" fill="#1D9E75">B</text>
  <text class="sub-l" x="123" y="322" text-anchor="middle" fill="#D85A30">C</text>
  <text class="sub-l" x="149" y="322" text-anchor="middle" fill="#D4537E">D</text>
  <text class="sub-l" x="231" y="322" text-anchor="middle" fill="#534AB7">A</text>
  <text class="sub-l" x="257" y="322" text-anchor="middle" fill="#1D9E75">B</text>
  <text class="sub-l" x="283" y="322" text-anchor="middle" fill="#D85A30">C</text>
  <text class="sub-l" x="309" y="322" text-anchor="middle" fill="#D4537E">D</text>
  <text class="sub-l" x="391" y="322" text-anchor="middle" fill="#534AB7">A</text>
  <text class="sub-l" x="417" y="322" text-anchor="middle" fill="#1D9E75">B</text>
  <text class="sub-l" x="443" y="322" text-anchor="middle" fill="#D85A30">C</text>
  <text class="sub-l" x="469" y="322" text-anchor="middle" fill="#D4537E">D</text>
  <text class="sub-l" x="551" y="322" text-anchor="middle" fill="#534AB7">A</text>
  <text class="sub-l" x="577" y="322" text-anchor="middle" fill="#1D9E75">B</text>
  <text class="sub-l" x="603" y="322" text-anchor="middle" fill="#D85A30">C</text>
  <text class="sub-l" x="629" y="322" text-anchor="middle" fill="#D4537E">D</text>
  <text class="rank" x="110" y="354" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="354" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="354" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="354" text-anchor="middle">P3</text>

  <text class="cap" x="340" y="392" text-anchor="middle">collect every chunk, then send the whole buffer to all  →  every process holds A B C D  (= gather + broadcast)</text>
</svg>
