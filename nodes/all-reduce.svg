<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="'Iowan Old Style',Palatino,Georgia,serif" role="img" aria-labelledby="title desc">
  <title id="title">All-reduce concept diagram</title>
  <desc id="desc">All-reduce is reduce followed by broadcast: every process contributes a value, the values are combined into one result, and then every process — not just the root — receives that…</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg{fill:#FBFAF7}
      .title{fill:#1B1A17;font-size:16px;font-weight:600}
      .sub{fill:#5A564E;font-size:11.5px;font-style:italic;font-family:sans-serif}
      .rowlab{fill:#8A857C;font-size:11px;font-family:sans-serif;font-style:italic}
      .rank{fill:#8A857C;font-size:11px;font-family:sans-serif}
      .cap{fill:#5A564E;font-size:12.5px;font-family:sans-serif}
      .lbl{font-size:15px;font-weight:600;font-family:sans-serif}
      .combine{fill:#5A564E;fill-opacity:0.05;stroke:#B0ABA2;stroke-width:1}
      .clab{fill:#8A857C;font-size:11px;font-family:sans-serif;letter-spacing:1px}
      .eq{font-size:15px;font-weight:600;font-family:sans-serif}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="420" rx="6"/>

  <text class="title" x="32" y="30">All-reduce</text>
  <text class="sub" x="128" y="30">like reduce, but every process gets the result  ·  all → all, computed</text>

  <!-- before: each process holds a value -->
  <text class="rowlab" x="32" y="92">before</text>
  <rect x="68"  y="70" width="84" height="40" rx="6" fill="#534AB7" fill-opacity="0.14" stroke="#534AB7" stroke-width="1.2"/>
  <rect x="228" y="70" width="84" height="40" rx="6" fill="#1D9E75" fill-opacity="0.14" stroke="#1D9E75" stroke-width="1.2"/>
  <rect x="388" y="70" width="84" height="40" rx="6" fill="#D85A30" fill-opacity="0.14" stroke="#D85A30" stroke-width="1.2"/>
  <rect x="548" y="70" width="84" height="40" rx="6" fill="#D4537E" fill-opacity="0.14" stroke="#D4537E" stroke-width="1.2"/>
  <text class="lbl" x="110" y="95" text-anchor="middle" fill="#534AB7">3</text>
  <text class="lbl" x="270" y="95" text-anchor="middle" fill="#1D9E75">5</text>
  <text class="lbl" x="430" y="95" text-anchor="middle" fill="#D85A30">2</text>
  <text class="lbl" x="590" y="95" text-anchor="middle" fill="#D4537E">7</text>
  <text class="rank" x="110" y="126" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="126" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="126" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="126" text-anchor="middle">P3</text>

  <!-- converge on the combine box (color-matched) -->
  <path d="M110 112 C 160 140, 270 150, 300 196" fill="none" stroke="#534AB7" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>
  <path d="M270 112 C 300 140, 320 150, 326 196" fill="none" stroke="#1D9E75" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>
  <path d="M430 112 C 400 140, 360 150, 354 196" fill="none" stroke="#D85A30" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>
  <path d="M590 112 C 540 140, 410 150, 380 196" fill="none" stroke="#D4537E" stroke-width="1.6" opacity="0.6" marker-end="url(#ah)"/>

  <!-- combine box -->
  <text class="clab" x="340" y="184" text-anchor="middle">SUM  (⊕)</text>
  <rect class="combine" x="250" y="196" width="180" height="46" rx="8"/>
  <text class="eq" x="340" y="224" text-anchor="middle">
    <tspan fill="#534AB7">3</tspan><tspan fill="#5A564E"> + </tspan><tspan fill="#1D9E75">5</tspan><tspan fill="#5A564E"> + </tspan><tspan fill="#D85A30">2</tspan><tspan fill="#5A564E"> + </tspan><tspan fill="#D4537E">7</tspan><tspan fill="#5A564E"> = </tspan><tspan fill="#BA7517">17</tspan>
  </text>

  <!-- result fans back out to EVERY process (amber = computed) -->
  <path d="M300 244 C 220 278, 150 286, 112 296"  fill="none" stroke="#BA7517" stroke-width="1.8" opacity="0.7" marker-end="url(#ah)"/>
  <path d="M318 244 C 300 270, 285 285, 274 296"  fill="none" stroke="#BA7517" stroke-width="1.8" opacity="0.7" marker-end="url(#ah)"/>
  <path d="M362 244 C 380 270, 396 285, 426 296"  fill="none" stroke="#BA7517" stroke-width="1.8" opacity="0.7" marker-end="url(#ah)"/>
  <path d="M380 244 C 460 278, 540 286, 588 296"  fill="none" stroke="#BA7517" stroke-width="1.8" opacity="0.7" marker-end="url(#ah)"/>

  <!-- after: every process holds the computed result -->
  <text class="rowlab" x="32" y="320">after</text>
  <rect x="68"  y="298" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <rect x="228" y="298" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <rect x="388" y="298" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <rect x="548" y="298" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <text class="lbl" x="110" y="323" text-anchor="middle" fill="#BA7517">17</text>
  <text class="lbl" x="270" y="323" text-anchor="middle" fill="#BA7517">17</text>
  <text class="lbl" x="430" y="323" text-anchor="middle" fill="#BA7517">17</text>
  <text class="lbl" x="590" y="323" text-anchor="middle" fill="#BA7517">17</text>
  <text class="rank" x="110" y="354" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="354" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="354" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="354" text-anchor="middle">P3</text>

  <text class="cap" x="340" y="392" text-anchor="middle">combine like reduce, then send the result back to all  →  every process holds 17  (= reduce + broadcast)</text>
</svg>
