<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 790" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">All-to-all transposes source rows into personalized destination rows</title>
  <desc id="desc">Before all-to-all, each of four source processes owns a row containing one different chunk for each destination. The collective transposes that source-by-destination matrix. Afterward, each destination process owns one row containing exactly one chunk from every source. The highlighted chunk a2 moves from source P0's destination-2 column to destination P2's source-P0 column. Values are moved, not combined.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
      .axis { font-size: 15px; font-weight: 650; fill: #536B7E; }
      .label { font-size: 17px; font-weight: 650; }
      .cell { font-size: 16px; font-weight: 700; }
      .small { font-size: 15px; fill: #536B7E; }
      .blue { fill: #DDEAFF; stroke: #3977B8; stroke-width: 2; }
      .teal { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 2; }
      .coral { fill: #FBE3DD; stroke: #D85A30; stroke-width: 2; }
      .purple { fill: #EEE4FA; stroke: #7A5CB0; stroke-width: 2; }
      .trace { stroke: #D89016; stroke-width: 4; }
      .rule { fill: #FFF1C7; stroke: #D89016; stroke-width: 2.5; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#7B8D9B"/>
    </marker>
  </defs>

  <rect width="720" height="780" fill="#FFFFFF"/>
  <text x="28" y="42" class="headline">All-to-all transposes personalized pieces</text>
  <text x="28" y="70" class="subtitle">All-to-all moves a source×destination matrix into destination×source order</text>

  <text x="28" y="112" class="stage">1 · BEFORE — EACH SOURCE OWNS ONE OUTGOING ROW</text>
  <text x="28" y="138" class="small">Cell ij is the piece sent from source Pᵢ to destination Pⱼ.</text>
  <text x="360" y="168" text-anchor="middle" class="axis">destination →</text>
  <text x="210" y="192" text-anchor="middle" class="axis">P0</text>
  <text x="310" y="192" text-anchor="middle" class="axis">P1</text>
  <text x="410" y="192" text-anchor="middle" class="axis">P2</text>
  <text x="510" y="192" text-anchor="middle" class="axis">P3</text>
  <text x="91" y="285" text-anchor="middle" class="axis" transform="rotate(-90 91 285)">source →</text>

  <g aria-label="Outgoing source by destination matrix">
    <text x="135" y="225" text-anchor="end" class="label">P0</text>
    <rect x="160" y="202" width="100" height="46" class="blue"/><rect x="260" y="202" width="100" height="46" class="blue"/><rect x="360" y="202" width="100" height="46" class="blue trace"/><rect x="460" y="202" width="100" height="46" class="blue"/>
    <text x="210" y="231" text-anchor="middle" class="cell">a₀</text><text x="310" y="231" text-anchor="middle" class="cell">a₁</text><text x="410" y="231" text-anchor="middle" class="cell">a₂</text><text x="510" y="231" text-anchor="middle" class="cell">a₃</text>

    <text x="135" y="271" text-anchor="end" class="label">P1</text>
    <rect x="160" y="248" width="100" height="46" class="teal"/><rect x="260" y="248" width="100" height="46" class="teal"/><rect x="360" y="248" width="100" height="46" class="teal"/><rect x="460" y="248" width="100" height="46" class="teal"/>
    <text x="210" y="277" text-anchor="middle" class="cell">b₀</text><text x="310" y="277" text-anchor="middle" class="cell">b₁</text><text x="410" y="277" text-anchor="middle" class="cell">b₂</text><text x="510" y="277" text-anchor="middle" class="cell">b₃</text>

    <text x="135" y="317" text-anchor="end" class="label">P2</text>
    <rect x="160" y="294" width="100" height="46" class="coral"/><rect x="260" y="294" width="100" height="46" class="coral"/><rect x="360" y="294" width="100" height="46" class="coral"/><rect x="460" y="294" width="100" height="46" class="coral"/>
    <text x="210" y="323" text-anchor="middle" class="cell">c₀</text><text x="310" y="323" text-anchor="middle" class="cell">c₁</text><text x="410" y="323" text-anchor="middle" class="cell">c₂</text><text x="510" y="323" text-anchor="middle" class="cell">c₃</text>

    <text x="135" y="363" text-anchor="end" class="label">P3</text>
    <rect x="160" y="340" width="100" height="46" class="purple"/><rect x="260" y="340" width="100" height="46" class="purple"/><rect x="360" y="340" width="100" height="46" class="purple"/><rect x="460" y="340" width="100" height="46" class="purple"/>
    <text x="210" y="369" text-anchor="middle" class="cell">d₀</text><text x="310" y="369" text-anchor="middle" class="cell">d₁</text><text x="410" y="369" text-anchor="middle" class="cell">d₂</text><text x="510" y="369" text-anchor="middle" class="cell">d₃</text>
  </g>

  <path d="M360 398 V437" fill="none" stroke="#7B8D9B" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="110" y="410" width="188" height="54" rx="10" class="rule"/>
  <text x="204" y="433" text-anchor="middle" class="axis">trace one piece</text>
  <text x="204" y="454" text-anchor="middle" class="label">a₂: P0 → P2</text>
  <rect x="422" y="410" width="188" height="54" rx="10" class="neutral"/>
  <text x="516" y="433" text-anchor="middle" class="axis">collective rule</text>
  <text x="516" y="454" text-anchor="middle" class="label">transpose, never sum</text>

  <text x="28" y="505" class="stage">2 · AFTER — EACH DESTINATION OWNS ONE PERSONALIZED ROW</text>
  <text x="28" y="531" class="small">Pⱼ receives the j-th piece from every source—not every piece.</text>
  <text x="360" y="561" text-anchor="middle" class="axis">source →</text>
  <text x="210" y="585" text-anchor="middle" class="axis">P0</text>
  <text x="310" y="585" text-anchor="middle" class="axis">P1</text>
  <text x="410" y="585" text-anchor="middle" class="axis">P2</text>
  <text x="510" y="585" text-anchor="middle" class="axis">P3</text>
  <text x="91" y="678" text-anchor="middle" class="axis" transform="rotate(-90 91 678)">destination →</text>

  <g aria-label="Incoming destination by source matrix">
    <text x="135" y="618" text-anchor="end" class="label">P0</text>
    <rect x="160" y="595" width="100" height="46" class="blue"/><rect x="260" y="595" width="100" height="46" class="teal"/><rect x="360" y="595" width="100" height="46" class="coral"/><rect x="460" y="595" width="100" height="46" class="purple"/>
    <text x="210" y="624" text-anchor="middle" class="cell">a₀</text><text x="310" y="624" text-anchor="middle" class="cell">b₀</text><text x="410" y="624" text-anchor="middle" class="cell">c₀</text><text x="510" y="624" text-anchor="middle" class="cell">d₀</text>

    <text x="135" y="664" text-anchor="end" class="label">P1</text>
    <rect x="160" y="641" width="100" height="46" class="blue"/><rect x="260" y="641" width="100" height="46" class="teal"/><rect x="360" y="641" width="100" height="46" class="coral"/><rect x="460" y="641" width="100" height="46" class="purple"/>
    <text x="210" y="670" text-anchor="middle" class="cell">a₁</text><text x="310" y="670" text-anchor="middle" class="cell">b₁</text><text x="410" y="670" text-anchor="middle" class="cell">c₁</text><text x="510" y="670" text-anchor="middle" class="cell">d₁</text>

    <text x="135" y="710" text-anchor="end" class="label">P2</text>
    <rect x="160" y="687" width="100" height="46" class="blue trace"/><rect x="260" y="687" width="100" height="46" class="teal"/><rect x="360" y="687" width="100" height="46" class="coral"/><rect x="460" y="687" width="100" height="46" class="purple"/>
    <text x="210" y="716" text-anchor="middle" class="cell">a₂</text><text x="310" y="716" text-anchor="middle" class="cell">b₂</text><text x="410" y="716" text-anchor="middle" class="cell">c₂</text><text x="510" y="716" text-anchor="middle" class="cell">d₂</text>

    <text x="135" y="756" text-anchor="end" class="label">P3</text>
    <rect x="160" y="733" width="100" height="46" class="blue"/><rect x="260" y="733" width="100" height="46" class="teal"/><rect x="360" y="733" width="100" height="46" class="coral"/><rect x="460" y="733" width="100" height="46" class="purple"/>
    <text x="210" y="762" text-anchor="middle" class="cell">a₃</text><text x="310" y="762" text-anchor="middle" class="cell">b₃</text><text x="410" y="762" text-anchor="middle" class="cell">c₃</text><text x="510" y="762" text-anchor="middle" class="cell">d₃</text>
  </g>
</svg>
