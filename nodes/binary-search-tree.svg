<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">A binary search tree routes lookup and insertion through left-smaller and right-larger links</title>
  <desc id="desc">A tree built from 5, 3, 8, 1, and 4 has root 5, children 3 and 8, and children 1 and 4 beneath 3. Looking up 4 follows 5 to 3 to 4 and succeeds in three comparisons. Inserting 6 follows 5 to 8 to an empty left link, where one new node is attached without moving existing nodes. The final in-order traversal is 1, 3, 4, 5, 6, 8.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; fill: #536B7E; }
      .node { fill: #F3F5F6; stroke: #7B8D9B; stroke-width: 2; }
      .found { fill: #FFF1C7; stroke: #D89016; stroke-width: 3; }
      .new { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 3; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
      .lookup-card { fill: #FFF1C7; stroke: #D89016; stroke-width: 2.5; }
      .insert-card { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 2.5; }
      .edge { fill: none; stroke: #9BA8B2; stroke-width: 2.5; }
      .lookup { fill: none; stroke: #D89016; stroke-width: 5; }
      .insert { fill: none; stroke: #3F9B86; stroke-width: 4; stroke-dasharray: 8 6; }
      .lookup-text { fill: #9B620E; font-size: 15px; font-weight: 700; }
      .insert-text { fill: #2D7565; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="720" height="700" fill="#FFFFFF"/>
  <text x="28" y="42" class="headline">A BST turns comparisons into left or right links</text>
  <text x="28" y="70" class="subtitle">Lookup discards a branch; insertion fills one empty link without shifting nodes</text>
  <rect x="82" y="91" width="556" height="42" rx="10" class="neutral"/>
  <text x="360" y="118" text-anchor="middle" class="label">every left subtree &lt; node &lt; every right subtree</text>

  <text x="28" y="163" class="stage">ONE ORDERED TREE · TWO WALKS</text>
  <g aria-label="Binary search tree after inserting 6">
    <path d="M341 203 L249 258 M379 203 L471 258 M212 297 L168 352 M248 297 L292 352 M471 297 L438 352" class="edge"/>
    <path d="M341 203 L249 258 M248 297 L292 352" class="lookup"/>
    <path d="M379 203 L471 258 M471 297 L438 352" class="insert"/>

    <circle cx="360" cy="180" r="29" class="node"/><text x="360" y="187" text-anchor="middle" class="value">5</text>
    <text x="360" y="146" text-anchor="middle" class="small">root</text>
    <circle cx="230" cy="280" r="29" class="node"/><text x="230" y="287" text-anchor="middle" class="value">3</text>
    <circle cx="490" cy="280" r="29" class="node"/><text x="490" y="287" text-anchor="middle" class="value">8</text>
    <circle cx="150" cy="375" r="29" class="node"/><text x="150" y="382" text-anchor="middle" class="value">1</text>
    <circle cx="310" cy="375" r="29" class="found"/><text x="310" y="382" text-anchor="middle" class="value">4</text>
    <text x="310" y="418" text-anchor="middle" class="lookup-text">FOUND</text>
    <circle cx="420" cy="375" r="29" class="new"/><text x="420" y="382" text-anchor="middle" class="value">6</text>
    <text x="420" y="418" text-anchor="middle" class="insert-text">NEW LINK</text>

    <text x="274" y="222" class="lookup-text">4 &lt; 5</text>
    <text x="267" y="326" class="lookup-text">4 &gt; 3</text>
    <text x="415" y="222" class="insert-text">6 &gt; 5</text>
    <text x="425" y="326" class="insert-text">6 &lt; 8</text>
    <text x="90" y="285" class="small">smaller ←</text>
    <text x="550" y="285" class="small">→ larger</text>
  </g>

  <g aria-label="Lookup and insertion steps">
    <rect x="40" y="451" width="300" height="111" rx="11" class="lookup-card"/>
    <text x="60" y="480" class="stage">LOOK UP 4</text>
    <text x="60" y="507" class="label">5 → 3 → 4</text>
    <text x="60" y="533" class="small">three comparisons · one node per level</text>
    <text x="60" y="554" class="small">each comparison discards a whole branch</text>

    <rect x="380" y="451" width="300" height="111" rx="11" class="insert-card"/>
    <text x="400" y="480" class="stage">INSERT 6</text>
    <text x="400" y="507" class="label">5 → 8 → empty left link</text>
    <text x="400" y="533" class="small">attach one new node</text>
    <text x="400" y="554" class="small">every existing node stays where it was</text>
  </g>

  <rect x="80" y="588" width="560" height="46" rx="10" class="neutral"/>
  <text x="360" y="617" text-anchor="middle" class="label">in-order after insert: [1, 3, 4, 5, 6, 8]</text>
  <text x="360" y="661" text-anchor="middle" class="stage">COST FOLLOWS HEIGHT</text>
  <text x="360" y="685" text-anchor="middle" class="small">Balanced: about log₂(n) levels · sorted insertions can degenerate into an O(n) chain.</text>
</svg>
