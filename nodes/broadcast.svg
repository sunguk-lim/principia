<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="'Iowan Old Style',Palatino,Georgia,serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg{fill:#FBFAF7}
      .title{fill:#1B1A17;font-size:16px;font-weight:600}
      .sub{fill:#5A564E;font-size:11.5px;font-style:italic;font-family:sans-serif}
      .rowlab{fill:#8A857C;font-size:11px;font-family:sans-serif;font-style:italic}
      .on{fill:#534AB7;fill-opacity:0.14;stroke:#534AB7;stroke-width:1.2}
      .off{fill:#B8B3AA;fill-opacity:0.10;stroke:#C9C4BB;stroke-width:1}
      .data{fill:#534AB7;font-size:15px;font-weight:600;font-family:sans-serif}
      .rank{fill:#8A857C;font-size:11px;font-family:sans-serif}
      .flow{stroke:#534AB7;stroke-width:1.6;fill:none;opacity:0.55}
      .cap{fill:#5A564E;font-size:12.5px;font-family:sans-serif}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="340" rx="6"/>

  <text class="title" x="32" y="30">Broadcast</text>
  <text class="sub" x="118" y="30">root sends the same data to every process  ·  one → all</text>

  <!-- before -->
  <text class="rowlab" x="32" y="92">before</text>
  <!-- P0 holds A -->
  <rect class="on"  x="68"  y="70" width="84" height="40" rx="6"/>
  <text class="data" x="110" y="95" text-anchor="middle">A</text>
  <rect class="off" x="228" y="70" width="84" height="40" rx="6"/>
  <rect class="off" x="388" y="70" width="84" height="40" rx="6"/>
  <rect class="off" x="548" y="70" width="84" height="40" rx="6"/>
  <text class="rank" x="110" y="126" text-anchor="middle">P0  (root)</text>
  <text class="rank" x="270" y="126" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="126" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="126" text-anchor="middle">P3</text>

  <!-- flow: A fans out from P0 to every after-box -->
  <path class="flow" d="M110 112 L110 228" marker-end="url(#ah)"/>
  <path class="flow" d="M120 112 C 180 160, 230 175, 268 226" marker-end="url(#ah)"/>
  <path class="flow" d="M126 112 C 250 150, 360 165, 426 226" marker-end="url(#ah)"/>
  <path class="flow" d="M132 112 C 320 145, 500 160, 586 226" marker-end="url(#ah)"/>

  <!-- after -->
  <text class="rowlab" x="32" y="252">after</text>
  <rect class="on" x="68"  y="230" width="84" height="40" rx="6"/>
  <rect class="on" x="228" y="230" width="84" height="40" rx="6"/>
  <rect class="on" x="388" y="230" width="84" height="40" rx="6"/>
  <rect class="on" x="548" y="230" width="84" height="40" rx="6"/>
  <text class="data" x="110" y="255" text-anchor="middle">A</text>
  <text class="data" x="270" y="255" text-anchor="middle">A</text>
  <text class="data" x="430" y="255" text-anchor="middle">A</text>
  <text class="data" x="590" y="255" text-anchor="middle">A</text>
  <text class="rank" x="110" y="286" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="286" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="286" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="286" text-anchor="middle">P3</text>

  <text class="cap" x="340" y="320" text-anchor="middle">P0 holds A  →  every process now holds its own copy of A  (one color = one datum, traced from source)</text>
</svg>
