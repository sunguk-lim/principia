<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention streams score tiles through SRAM</title>
  <desc id="desc">Keys and values stream from HBM into SRAM one tile at a time. Each tile updates a running maximum, denominator, and weighted numerator. The final output is written once, while the full N by N score matrix is never stored in HBM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 27px system-ui,sans-serif;fill:#172033}.subtitle{font:15px system-ui,sans-serif;fill:#526077}.head{font:700 15px system-ui,sans-serif;letter-spacing:.07em;fill:#344054}.step{font:700 16px system-ui,sans-serif;fill:#172033}.main{font:700 16px system-ui,sans-serif;fill:#172033}.small{font:14px system-ui,sans-serif;fill:#526077}.tiny{font:13px system-ui,sans-serif;fill:#526077}.mono{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#172033}.compact{font-size:14px}.region{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.tile{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.carry{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.result{fill:#ecfdf5;stroke:#6ee7b7;stroke-width:1.5}.hbm{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:1.5}.avoid{fill:#fff1f2;stroke:#fda4af;stroke-width:1.5}.line{fill:none;stroke-width:2.5;stroke-linecap:round}.blue{stroke:#2563eb}.green{stroke:#0f766e}.cross{stroke:#e11d48;stroke-width:4;stroke-linecap:round}
    </style>
  </defs>

  <text x="360" y="38" text-anchor="middle" class="title">FlashAttention: stream, carry, discard</text>
  <text x="360" y="66" text-anchor="middle" class="subtitle">Exact attention without writing the full score matrix to HBM.</text>

  <rect x="20" y="91" width="680" height="454" rx="14" class="region"/>
  <text x="40" y="120" class="head">SRAM · ON-CHIP · FAST · SMALL</text>
  <text x="680" y="120" text-anchor="end" class="small">one score tile exists at a time</text>

  <rect x="44" y="146" width="134" height="82" rx="10" class="tile"/>
  <text x="111" y="174" text-anchor="middle" class="step">TILE 1</text>
  <text x="111" y="197" text-anchor="middle" class="mono">S = [1, 3]</text>
  <text x="111" y="217" text-anchor="middle" class="small">V = [10, 20]</text>
  <path d="M178 187H220" class="line blue" marker-end="url(#arrow)"/>
  <text x="199" y="175" text-anchor="middle" class="tiny">fold</text>
  <rect x="226" y="146" width="235" height="82" rx="10" class="carry"/>
  <text x="343" y="173" text-anchor="middle" class="step">RUNNING CARRY</text>
  <text x="343" y="198" text-anchor="middle" class="mono">m = 3 · ℓ = 1.14</text>
  <text x="343" y="219" text-anchor="middle" class="mono">O = 21.4</text>
  <text x="486" y="178" class="small">tracks:</text>
  <text x="486" y="201" class="small">max · denominator</text>
  <text x="486" y="222" class="small">weighted numerator</text>

  <path d="M343 228V271" class="line blue" marker-end="url(#arrow)"/>
  <text x="357" y="255" class="tiny">keep only (m, ℓ, O)</text>

  <rect x="44" y="281" width="134" height="82" rx="10" class="tile"/>
  <text x="111" y="309" text-anchor="middle" class="step">TILE 2</text>
  <text x="111" y="332" text-anchor="middle" class="mono">S = [2, 5]</text>
  <text x="111" y="352" text-anchor="middle" class="small">V = [30, 40]</text>
  <path d="M178 322H220" class="line blue" marker-end="url(#arrow)"/>
  <text x="199" y="310" text-anchor="middle" class="tiny">merge</text>
  <rect x="226" y="281" width="235" height="82" rx="10" class="carry"/>
  <text x="343" y="306" text-anchor="middle" class="step">REBASE + UPDATE</text>
  <text x="343" y="330" text-anchor="middle" class="mono">α = e³⁻⁵ = 0.135</text>
  <text x="343" y="353" text-anchor="middle" class="mono compact">m = 5 · ℓ = 1.20 · O = 44.4</text>
  <text x="486" y="306" class="small">new max 5:</text>
  <text x="486" y="329" class="small">scale old carry once,</text>
  <text x="486" y="350" class="small">then add this tile</text>

  <path d="M343 363V408" class="line green" marker-end="url(#arrow-green)"/>
  <text x="357" y="392" class="tiny">last tile → normalize</text>
  <rect x="200" y="418" width="286" height="76" rx="10" class="result"/>
  <text x="343" y="446" text-anchor="middle" class="step">EXACT OUTPUT</text>
  <text x="343" y="475" text-anchor="middle" class="mono">O / ℓ = 44.4 / 1.20 = 36.9</text>
  <text x="40" y="525" class="main">Invariant: O / ℓ is exact attention over every key processed so far.</text>

  <rect x="20" y="570" width="680" height="105" rx="14" class="hbm"/>
  <text x="40" y="599" class="head">HBM · OFF-CHIP · SLOW · LARGE</text>
  <rect x="43" y="614" width="157" height="42" rx="8" class="tile"/>
  <text x="121" y="640" text-anchor="middle" class="main">Q · K/V tiles</text>
  <path d="M82 614V559C82 551 30 551 30 535V187H44" class="line blue" marker-end="url(#arrow)"/>
  <path d="M160 614V562C160 555 36 555 36 535V322H44" class="line blue" marker-end="url(#arrow)"/>
  <text x="109" y="567" class="tiny">stream tiles up</text>

  <rect x="272" y="608" width="176" height="53" rx="8" class="avoid"/>
  <text x="360" y="630" text-anchor="middle" class="main">N × N score matrix</text>
  <text x="360" y="651" text-anchor="middle" class="small">never written here</text>
  <line x1="286" y1="614" x2="434" y2="655" class="cross"/>
  <line x1="434" y1="614" x2="286" y2="655" class="cross"/>

  <rect x="520" y="614" width="157" height="42" rx="8" class="result"/>
  <text x="598" y="640" text-anchor="middle" class="main">final O = 36.9</text>
  <path d="M486 456H598V608" class="line green" marker-end="url(#arrow-green)"/>
  <text x="542" y="444" text-anchor="middle" class="tiny">write output once</text>

  <text x="360" y="695" text-anchor="middle" class="main">Less HBM traffic · exact same attention</text>
</svg>
