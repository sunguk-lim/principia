<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'Iowan Old Style',Palatino,Georgia,serif">
  <defs>
    <style>
      .bg{fill:#FBFAF7}
      .title{fill:#1B1A17;font-size:16px;font-weight:600}
      .sub{fill:#5A564E;font-size:11px;font-style:italic;font-family:sans-serif}
      .pt{font-size:11px;font-weight:700;font-family:sans-serif}
      .rl{fill:#8A857C;font-size:9px;font-style:italic;font-family:sans-serif}
      .cz{font-size:10px;font-weight:700;font-family:sans-serif}
      .cap{fill:#5A564E;font-size:10.5px;font-family:sans-serif}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="360" rx="6"/>

  <text class="title" x="30" y="27">Grouped-query attention (GQA / MQA)</text>
  <text class="sub" x="340" y="27">share K,V heads across query heads &#8594; shrink the KV-cache</text>

  <!-- row guides -->
  <text class="rl" x="52" y="100" text-anchor="end">query heads</text>
  <text class="rl" x="52" y="214" text-anchor="end">KV heads</text>
  <text class="rl" x="52" y="246" text-anchor="end">KV-cache</text>

  <!-- =============== MHA (center 175) =============== -->
  <text class="pt" x="175" y="68" text-anchor="middle" fill="#5E7488">MHA &#8212; 8 KV heads</text>
  <!-- query heads -->
  <g fill="#5E7488" fill-opacity="0.20" stroke="#5E7488">
    <rect x="92"  y="86" width="16" height="18" rx="2"/><rect x="114" y="86" width="16" height="18" rx="2"/>
    <rect x="136" y="86" width="16" height="18" rx="2"/><rect x="158" y="86" width="16" height="18" rx="2"/>
    <rect x="180" y="86" width="16" height="18" rx="2"/><rect x="202" y="86" width="16" height="18" rx="2"/>
    <rect x="224" y="86" width="16" height="18" rx="2"/><rect x="246" y="86" width="16" height="18" rx="2"/>
  </g>
  <!-- 1:1 mapping lines -->
  <g stroke="#5E7488" stroke-width="1.1" opacity="0.5">
    <line x1="100" y1="104" x2="100" y2="196"/><line x1="122" y1="104" x2="122" y2="196"/>
    <line x1="144" y1="104" x2="144" y2="196"/><line x1="166" y1="104" x2="166" y2="196"/>
    <line x1="188" y1="104" x2="188" y2="196"/><line x1="210" y1="104" x2="210" y2="196"/>
    <line x1="232" y1="104" x2="232" y2="196"/><line x1="254" y1="104" x2="254" y2="196"/>
  </g>
  <!-- KV heads (8) -->
  <g fill="#5E7488" fill-opacity="0.30" stroke="#5E7488">
    <rect x="92"  y="196" width="16" height="18" rx="2"/><rect x="114" y="196" width="16" height="18" rx="2"/>
    <rect x="136" y="196" width="16" height="18" rx="2"/><rect x="158" y="196" width="16" height="18" rx="2"/>
    <rect x="180" y="196" width="16" height="18" rx="2"/><rect x="202" y="196" width="16" height="18" rx="2"/>
    <rect x="224" y="196" width="16" height="18" rx="2"/><rect x="246" y="196" width="16" height="18" rx="2"/>
  </g>
  <!-- cache bar (8x = full) -->
  <rect x="95" y="234" width="160" height="13" rx="2" fill="#E8A317" fill-opacity="0.30" stroke="#E8A317"/>
  <text class="cz" x="175" y="266" text-anchor="middle" fill="#B07908">8&#215; (full)</text>

  <!-- =============== GQA (center 410) =============== -->
  <text class="pt" x="410" y="68" text-anchor="middle" fill="#3F3B34">GQA &#8212; 2 KV heads (groups of 4)</text>
  <!-- group shading -->
  <rect x="322" y="82" width="86" height="26" rx="4" fill="#1D9E75" fill-opacity="0.06"/>
  <rect x="412" y="82" width="86" height="26" rx="4" fill="#534AB7" fill-opacity="0.06"/>
  <!-- query heads: group A teal (4), group B purple (4) -->
  <g fill="#1D9E75" fill-opacity="0.20" stroke="#1D9E75">
    <rect x="327" y="86" width="16" height="18" rx="2"/><rect x="349" y="86" width="16" height="18" rx="2"/>
    <rect x="371" y="86" width="16" height="18" rx="2"/><rect x="393" y="86" width="16" height="18" rx="2"/>
  </g>
  <g fill="#534AB7" fill-opacity="0.20" stroke="#534AB7">
    <rect x="417" y="86" width="16" height="18" rx="2"/><rect x="439" y="86" width="16" height="18" rx="2"/>
    <rect x="461" y="86" width="16" height="18" rx="2"/><rect x="483" y="86" width="16" height="18" rx="2"/>
  </g>
  <!-- mapping: group A -> KV_A, group B -> KV_B -->
  <g stroke="#1D9E75" stroke-width="1.1" opacity="0.5">
    <line x1="335" y1="104" x2="365" y2="196"/><line x1="357" y1="104" x2="365" y2="196"/>
    <line x1="379" y1="104" x2="365" y2="196"/><line x1="401" y1="104" x2="365" y2="196"/>
  </g>
  <g stroke="#534AB7" stroke-width="1.1" opacity="0.5">
    <line x1="425" y1="104" x2="455" y2="196"/><line x1="447" y1="104" x2="455" y2="196"/>
    <line x1="469" y1="104" x2="455" y2="196"/><line x1="491" y1="104" x2="455" y2="196"/>
  </g>
  <!-- KV heads (2) -->
  <rect x="345" y="196" width="40" height="18" rx="3" fill="#1D9E75" fill-opacity="0.30" stroke="#1D9E75"/>
  <rect x="435" y="196" width="40" height="18" rx="3" fill="#534AB7" fill-opacity="0.30" stroke="#534AB7"/>
  <!-- cache bar (2x = quarter) -->
  <rect x="390" y="234" width="40" height="13" rx="2" fill="#E8A317" fill-opacity="0.30" stroke="#E8A317"/>
  <text class="cz" x="410" y="266" text-anchor="middle" fill="#B07908">2&#215; (&#188; of MHA)</text>

  <!-- =============== MQA (center 645) =============== -->
  <text class="pt" x="645" y="68" text-anchor="middle" fill="#A6471F">MQA &#8212; 1 KV head</text>
  <!-- query heads (8, coral) -->
  <g fill="#D85A30" fill-opacity="0.18" stroke="#D85A30">
    <rect x="562" y="86" width="16" height="18" rx="2"/><rect x="584" y="86" width="16" height="18" rx="2"/>
    <rect x="606" y="86" width="16" height="18" rx="2"/><rect x="628" y="86" width="16" height="18" rx="2"/>
    <rect x="650" y="86" width="16" height="18" rx="2"/><rect x="672" y="86" width="16" height="18" rx="2"/>
    <rect x="694" y="86" width="16" height="18" rx="2"/><rect x="716" y="86" width="16" height="18" rx="2"/>
  </g>
  <!-- all -> one KV -->
  <g stroke="#D85A30" stroke-width="1.1" opacity="0.45">
    <line x1="570" y1="104" x2="645" y2="196"/><line x1="592" y1="104" x2="645" y2="196"/>
    <line x1="614" y1="104" x2="645" y2="196"/><line x1="636" y1="104" x2="645" y2="196"/>
    <line x1="658" y1="104" x2="645" y2="196"/><line x1="680" y1="104" x2="645" y2="196"/>
    <line x1="702" y1="104" x2="645" y2="196"/><line x1="724" y1="104" x2="645" y2="196"/>
  </g>
  <!-- KV head (1) -->
  <rect x="625" y="196" width="40" height="18" rx="3" fill="#D85A30" fill-opacity="0.30" stroke="#D85A30"/>
  <!-- cache bar (1x = eighth) -->
  <rect x="635" y="234" width="20" height="13" rx="2" fill="#E8A317" fill-opacity="0.30" stroke="#E8A317"/>
  <text class="cz" x="645" y="266" text-anchor="middle" fill="#B07908">1&#215; (&#8539; of MHA)</text>

  <!-- captions -->
  <line x1="30" y1="284" x2="770" y2="284" stroke="#E2DDD3" stroke-width="1"/>
  <text class="cap" x="30" y="306">&#8226; Every query head stays; only the <tspan font-weight="700">number of K,V heads</tspan> changes &#8212; and the KV-cache scales with that count.</text>
  <text class="cap" x="30" y="326">&#8226; MQA shares one K,V across all heads (&#215;8 smaller, some quality cost); GQA shares one per <tspan font-style="italic">group</tspan> &#8212; most saving, most quality.</text>
  <text class="cap" x="30" y="346">&#8226; In practice: GQA in Llama-2 70B &amp; Mistral; MQA in PaLM &amp; Falcon.</text>
</svg>
