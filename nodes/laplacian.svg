<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">The Laplacian compares a point with its neighbors and drives smoothing</title>
  <desc id="desc">The continuous Laplacian is the divergence of the gradient and the sum of second partial derivatives. On a two-dimensional unit grid, a five-point stencil approximates it by north plus south plus east plus west minus four times the center. Four neighbors of value 4 surrounding a center value 8 give 16 minus 32 equals negative 16, marking a local peak. A diffusion step with rate 0.1 changes the center from 8 to 6.4, moving it toward its neighbors.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 22px; font-weight: 700; }
      .small { font-size: 15px; fill: #536B7E; }
      .neighbor { fill: #DDEAFF; stroke: #3977B8; stroke-width: 2; }
      .center { fill: #FBE3DD; stroke: #D85A30; stroke-width: 3; }
      .cooled { fill: #FFF1C7; stroke: #D89016; stroke-width: 3; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
      .empty { fill: #FAFBFC; stroke: #D6DDE2; stroke-width: 1.5; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#7B8D9B"/>
    </marker>
  </defs>

  <rect width="720" height="700" fill="#FFFFFF"/>
  <text x="28" y="42" class="headline">The Laplacian compares a point with its neighbors</text>
  <text x="28" y="70" class="subtitle">Its sign reveals a local peak or pit—and tells diffusion which way to smooth</text>

  <rect x="28" y="92" width="664" height="56" rx="10" class="neutral"/>
  <text x="360" y="117" text-anchor="middle" class="label">∇²f = ∇·(∇f) = ∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z²</text>
  <text x="360" y="139" text-anchor="middle" class="small">scalar field → scalar curvature signal</text>

  <text x="28" y="181" class="stage">FIVE-POINT STENCIL · UNIT GRID SPACING</text>
  <g aria-label="Four neighbors of value four surrounding a center of value eight">
    <rect x="60" y="205" width="86" height="86" class="empty"/>
    <rect x="146" y="205" width="86" height="86" class="neighbor"/>
    <rect x="232" y="205" width="86" height="86" class="empty"/>
    <rect x="60" y="291" width="86" height="86" class="neighbor"/>
    <rect x="146" y="291" width="86" height="86" class="center"/>
    <rect x="232" y="291" width="86" height="86" class="neighbor"/>
    <rect x="60" y="377" width="86" height="86" class="empty"/>
    <rect x="146" y="377" width="86" height="86" class="neighbor"/>
    <rect x="232" y="377" width="86" height="86" class="empty"/>
    <text x="189" y="239" text-anchor="middle" class="small">north</text><text x="189" y="270" text-anchor="middle" class="value">4</text>
    <text x="103" y="325" text-anchor="middle" class="small">west</text><text x="103" y="356" text-anchor="middle" class="value">4</text>
    <text x="189" y="325" text-anchor="middle" class="small">center</text><text x="189" y="356" text-anchor="middle" class="value">8</text>
    <text x="275" y="325" text-anchor="middle" class="small">east</text><text x="275" y="356" text-anchor="middle" class="value">4</text>
    <text x="189" y="411" text-anchor="middle" class="small">south</text><text x="189" y="442" text-anchor="middle" class="value">4</text>
  </g>

  <g aria-label="Discrete Laplacian calculation">
    <text x="370" y="211" class="stage">COMPARE NEIGHBORS WITH CENTER</text>
    <rect x="370" y="227" width="322" height="62" rx="9" class="neighbor"/>
    <text x="390" y="252" class="small">neighbor sum</text>
    <text x="672" y="272" text-anchor="end" class="value">4 + 4 + 4 + 4 = 16</text>
    <rect x="370" y="303" width="322" height="62" rx="9" class="center"/>
    <text x="390" y="328" class="small">four times the center</text>
    <text x="672" y="348" text-anchor="end" class="value">4 × 8 = 32</text>
    <rect x="370" y="379" width="322" height="84" rx="10" class="cooled"/>
    <text x="390" y="405" class="small">∇²f ≈ neighbors − 4·center</text>
    <text x="390" y="436" class="value">16 − 32 = −16</text>
    <text x="672" y="449" text-anchor="end" class="label">negative → local peak</text>
  </g>

  <text x="28" y="510" class="stage">DIFFUSION USES THAT CURVATURE TO SMOOTH</text>
  <rect x="60" y="542" width="130" height="80" rx="11" class="center"/>
  <text x="125" y="568" text-anchor="middle" class="small">hot center</text>
  <text x="125" y="604" text-anchor="middle" class="value">8</text>
  <path d="M205 582 H515" class="flow"/>
  <text x="360" y="561" text-anchor="middle" class="label">8 + 0.1 × (−16) = 6.4</text>
  <rect x="530" y="542" width="130" height="80" rx="11" class="cooled"/>
  <text x="595" y="568" text-anchor="middle" class="small">after one step</text>
  <text x="595" y="604" text-anchor="middle" class="value">6.4</text>

  <rect x="60" y="648" width="600" height="38" rx="9" class="neutral"/>
  <text x="360" y="673" text-anchor="middle" class="label">∇²f &lt; 0 at a peak · = 0 when locally flat · &gt; 0 in a pit</text>
</svg>
