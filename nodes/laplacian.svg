<svg viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.th{font-weight:600;font-size:15px;fill:#1B1A17}
.t{font-size:13px;fill:#1B1A17}
.ts{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;fill:#5A564E}
.c-blue{fill:#E3EFFB;stroke:#5B8FD0}
.c-teal{fill:#E2F3EE;stroke:#3F9B86}
.c-amber{fill:#FBF0DB;stroke:#C79A3E}
</style>
<rect x="0" y="0" width="680" height="360" fill="#FBFAF7"/>
        <title>The Laplacian as del dotted with del</title>
        <defs><marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
        <text class="th" x="40" y="30">Yes — the Laplacian is  ∇ · ∇</text>
        <text class="ts" x="40" y="52">the dot product of the del operator with itself.</text>
        <rect x="70" y="92" width="64" height="26" rx="3" fill="#F2EFE9" stroke="#D85A30" stroke-width="1"/>
        <rect x="70" y="120" width="64" height="26" rx="3" fill="#F2EFE9" stroke="#D85A30" stroke-width="1"/>
        <rect x="70" y="148" width="64" height="26" rx="3" fill="#F2EFE9" stroke="#D85A30" stroke-width="1"/>
        <path d="M66 92 L62 92 L62 174 L66 174" fill="none" stroke="#1B1A17" stroke-width="1.1"/>
        <path d="M138 92 L142 92 L142 174 L138 174" fill="none" stroke="#1B1A17" stroke-width="1.1"/>
        <text class="t" x="102" y="105" text-anchor="middle" dominant-baseline="central">∂/∂x</text>
        <text class="t" x="102" y="133" text-anchor="middle" dominant-baseline="central">∂/∂y</text>
        <text class="t" x="102" y="161" text-anchor="middle" dominant-baseline="central">∂/∂z</text>
        <text class="th" x="156" y="133" text-anchor="middle" dominant-baseline="central">·</text>
        <rect x="170" y="92" width="64" height="26" rx="3" fill="#F2EFE9" stroke="#D85A30" stroke-width="1"/>
        <rect x="170" y="120" width="64" height="26" rx="3" fill="#F2EFE9" stroke="#D85A30" stroke-width="1"/>
        <rect x="170" y="148" width="64" height="26" rx="3" fill="#F2EFE9" stroke="#D85A30" stroke-width="1"/>
        <path d="M166 92 L162 92 L162 174 L166 174" fill="none" stroke="#1B1A17" stroke-width="1.1"/>
        <path d="M238 92 L242 92 L242 174 L238 174" fill="none" stroke="#1B1A17" stroke-width="1.1"/>
        <text class="t" x="202" y="105" text-anchor="middle" dominant-baseline="central">∂/∂x</text>
        <text class="t" x="202" y="133" text-anchor="middle" dominant-baseline="central">∂/∂y</text>
        <text class="t" x="202" y="161" text-anchor="middle" dominant-baseline="central">∂/∂z</text>
        <text class="th" x="262" y="133" text-anchor="middle" dominant-baseline="central">=</text>
        <text class="t" x="282" y="133" dominant-baseline="central">∂²/∂x² + ∂²/∂y² + ∂²/∂z²</text>
        <text class="th" x="492" y="133" dominant-baseline="central">= ∇²</text>
        <text class="ts" x="540" y="133" dominant-baseline="central">Laplacian</text>
        <text class="ts" x="70" y="196">each matching pair  (∂/∂xᵢ)(∂/∂xᵢ) = ∂²/∂xᵢ²  — apply that derivative twice (composition, not arithmetic).</text>
        <line x1="40" y1="222" x2="640" y2="222" stroke="#E1DCD2" stroke-width="0.6"/>
        <text class="ts" x="40" y="250">Equivalently, as a composition on a function f:</text>
        <rect x="70" y="272" width="40" height="30" rx="5" class="c-blue" stroke-width="0.5"/>
        <text class="t" x="90" y="287" text-anchor="middle" dominant-baseline="central">f</text>
        <line x1="116" y1="287" x2="152" y2="287" stroke="#D85A30" stroke-width="1.4" marker-end="url(#ar3)"/>
        <text class="ts" x="134" y="274" text-anchor="middle">∇</text>
        <rect x="158" y="272" width="130" height="30" rx="5" class="c-teal" stroke-width="0.5"/>
        <text class="t" x="223" y="287" text-anchor="middle" dominant-baseline="central">∇f   (gradient)</text>
        <line x1="294" y1="287" x2="330" y2="287" stroke="#D85A30" stroke-width="1.4" marker-end="url(#ar3)"/>
        <text class="ts" x="312" y="274" text-anchor="middle">∇·</text>
        <rect x="336" y="272" width="170" height="30" rx="5" class="c-blue" stroke-width="0.5"/>
        <text class="t" x="421" y="287" text-anchor="middle" dominant-baseline="central">∇·(∇f) = ∇²f   (Laplacian)</text>
        <text class="ts" x="40" y="335">So ∇·∇ = ∇²: one operator, read either as "del dotted with del" or as "divergence after gradient".</text>
      </svg>