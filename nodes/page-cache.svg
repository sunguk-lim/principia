<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">How the page cache separates fast writes from durable storage</title>
  <desc id="desc">A program first misses and loads file pages from disk into the page cache, then hits in RAM. A write changes the cached page to version one while disk remains at version zero. Flushing makes version one durable; a crash before flushing loses it.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3b82f6"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
    <style>
      .title{font:700 27px system-ui,sans-serif;fill:#172033}.subtitle{font:15px system-ui,sans-serif;fill:#526077}.head{font:700 15px system-ui,sans-serif;letter-spacing:.08em;fill:#344054}.step{font:700 15px system-ui,sans-serif;fill:#172033}.main{font:700 16px system-ui,sans-serif;fill:#172033}.small{font:14px system-ui,sans-serif;fill:#526077}.tiny{font:13px system-ui,sans-serif;fill:#526077}.box{stroke-width:1.5}.program{fill:#eff6ff;stroke:#93c5fd}.cache{fill:#ecfdf5;stroke:#6ee7b7}.disk{fill:#f5f3ff;stroke:#c4b5fd}.dirty{fill:#fff7ed;stroke:#fdba74}.good{fill:#ecfdf5;stroke:#34d399}.bad{fill:#fff1f2;stroke:#fda4af}.line{fill:none;stroke-width:2.5;stroke-linecap:round}.divider{stroke:#d8dee9;stroke-width:1}.blue{stroke:#3b82f6}.teal{stroke:#0f766e}.gold{stroke:#b45309}
    </style>
  </defs>

  <text x="360" y="38" text-anchor="middle" class="title">Fast now. Durable later.</text>
  <text x="360" y="66" text-anchor="middle" class="subtitle">The page cache keeps file pages in RAM and delays disk writes.</text>

  <text x="125" y="103" text-anchor="middle" class="head">PROGRAM</text>
  <text x="360" y="103" text-anchor="middle" class="head">PAGE CACHE · RAM</text>
  <text x="595" y="103" text-anchor="middle" class="head">DISK</text>

  <line x1="20" y1="117" x2="700" y2="117" class="divider"/>
  <text x="26" y="143" class="step">1 · MISS</text>
  <rect x="45" y="155" width="160" height="66" rx="10" class="box program"/>
  <text x="125" y="182" text-anchor="middle" class="main">read #1</text>
  <text x="125" y="204" text-anchor="middle" class="small">receives 1 MB</text>
  <rect x="280" y="155" width="160" height="66" rx="10" class="box cache"/>
  <text x="360" y="182" text-anchor="middle" class="main">0 → 256 pages</text>
  <text x="360" y="204" text-anchor="middle" class="small">resident · v0</text>
  <rect x="515" y="155" width="160" height="66" rx="10" class="box disk"/>
  <text x="595" y="182" text-anchor="middle" class="main">256 blocks</text>
  <text x="595" y="204" text-anchor="middle" class="small">stored · v0</text>
  <path d="M515 175H446" class="line blue" marker-end="url(#arrow-blue)"/>
  <path d="M280 202H211" class="line teal" marker-end="url(#arrow-teal)"/>
  <text x="480" y="164" text-anchor="middle" class="tiny">fill</text>
  <text x="245" y="220" text-anchor="middle" class="tiny">copy</text>

  <line x1="20" y1="238" x2="700" y2="238" class="divider"/>
  <text x="26" y="264" class="step">2 · HIT</text>
  <rect x="45" y="276" width="160" height="62" rx="10" class="box program"/>
  <text x="125" y="302" text-anchor="middle" class="main">read #2</text>
  <text x="125" y="324" text-anchor="middle" class="small">receives 1 MB</text>
  <rect x="280" y="276" width="160" height="62" rx="10" class="box cache"/>
  <text x="360" y="302" text-anchor="middle" class="main">256 pages · v0</text>
  <text x="360" y="324" text-anchor="middle" class="small">reused from RAM</text>
  <rect x="515" y="276" width="160" height="62" rx="10" class="box disk" opacity=".62"/>
  <text x="595" y="313" text-anchor="middle" class="main">IDLE</text>
  <path d="M280 307H211" class="line teal" marker-end="url(#arrow-teal)"/>

  <line x1="20" y1="355" x2="700" y2="355" class="divider"/>
  <text x="26" y="381" class="step">3 · WRITE</text>
  <rect x="45" y="393" width="160" height="66" rx="10" class="box program"/>
  <text x="125" y="420" text-anchor="middle" class="main">write 512 B</text>
  <text x="125" y="442" text-anchor="middle" class="small">new data · v1</text>
  <rect x="280" y="393" width="160" height="66" rx="10" class="box dirty"/>
  <text x="360" y="420" text-anchor="middle" class="main">p0 = v1 · DIRTY</text>
  <text x="360" y="442" text-anchor="middle" class="small">write returns</text>
  <rect x="515" y="393" width="160" height="66" rx="10" class="box disk"/>
  <text x="595" y="420" text-anchor="middle" class="main">b0 = v0 · STALE</text>
  <text x="595" y="442" text-anchor="middle" class="small">not written yet</text>
  <path d="M205 426H274" class="line gold" marker-end="url(#arrow-gold)"/>

  <rect x="164" y="485" width="392" height="55" rx="10" class="box dirty"/>
  <text x="360" y="508" text-anchor="middle" class="main">Acknowledged, but not durable</text>
  <text x="360" y="529" text-anchor="middle" class="small">cache p0 = v1 DIRTY · disk b0 = v0 stale</text>

  <path d="M300 540C286 560 250 564 216 578" class="line teal" marker-end="url(#arrow-teal)"/>
  <path d="M420 540C434 560 470 564 504 578" class="line gold" marker-end="url(#arrow-gold)"/>
  <rect x="45" y="581" width="290" height="76" rx="11" class="box good"/>
  <text x="190" y="607" text-anchor="middle" class="main">FLUSH / fsync completes</text>
  <text x="190" y="630" text-anchor="middle" class="small">cache p0 = v1 clean</text>
  <text x="190" y="649" text-anchor="middle" class="small">disk b0 = v1 durable</text>
  <rect x="385" y="581" width="290" height="76" rx="11" class="box bad"/>
  <text x="530" y="607" text-anchor="middle" class="main">CRASH happens first</text>
  <text x="530" y="630" text-anchor="middle" class="small">cached v1 is lost</text>
  <text x="530" y="649" text-anchor="middle" class="small">disk remains v0</text>

  <text x="360" y="686" text-anchor="middle" class="main">write success ≠ durable storage</text>
</svg>
