<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">Reduce-scatter reduces each vector column and gives one result to its matching process</title>
  <desc id="desc">Processes P0 through P3 hold vectors [1,2,3,4], [5,3,1,2], [2,7,4,1], and [4,1,2,8]. Four independent column lanes sum to 12, 13, 10, and 15. Reduced slice 0 goes only to P0, slice 1 to P1, slice 2 to P2, and slice 3 to P3. No process receives the complete reduced vector.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 19px; font-weight: 700; }
      .small { font-size: 15px; fill: #536B7E; }
      .blue { fill: #DDEAFF; stroke: #3977B8; stroke-width: 2; }
      .teal { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 2; }
      .coral { fill: #FBE3DD; stroke: #D85A30; stroke-width: 2; }
      .purple { fill: #EEE4FA; stroke: #7A5CB0; stroke-width: 2; }
      .computed { fill: #FFF1C7; stroke-width: 3; }
      .blue-stroke { stroke: #3977B8; }
      .teal-stroke { stroke: #3F9B86; }
      .coral-stroke { stroke: #D85A30; }
      .purple-stroke { stroke: #7A5CB0; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#7B8D9B"/>
    </marker>
  </defs>

  <rect width="720" height="700" fill="#FFFFFF"/>
  <text x="28" y="42" class="headline">Reduce each column; give one result to each rank</text>
  <text x="28" y="70" class="subtitle">Reduce-scatter computes the full vector collectively but partitions its ownership</text>

  <text x="28" y="111" class="stage">1 · ALIGN EQUAL-LENGTH VECTORS BY SLICE</text>
  <text x="28" y="137" class="small">Column j contains every process's contribution to reduced slice j.</text>
  <text x="195" y="167" text-anchor="middle" class="small">slice 0 → P0</text>
  <text x="305" y="167" text-anchor="middle" class="small">slice 1 → P1</text>
  <text x="415" y="167" text-anchor="middle" class="small">slice 2 → P2</text>
  <text x="525" y="167" text-anchor="middle" class="small">slice 3 → P3</text>

  <g aria-label="Four process vectors aligned as a matrix">
    <text x="120" y="203" text-anchor="end" class="label">P0</text>
    <rect x="140" y="177" width="110" height="48" class="blue"/><rect x="250" y="177" width="110" height="48" class="teal"/><rect x="360" y="177" width="110" height="48" class="coral"/><rect x="470" y="177" width="110" height="48" class="purple"/>
    <text x="195" y="208" text-anchor="middle" class="value">1</text><text x="305" y="208" text-anchor="middle" class="value">2</text><text x="415" y="208" text-anchor="middle" class="value">3</text><text x="525" y="208" text-anchor="middle" class="value">4</text>

    <text x="120" y="251" text-anchor="end" class="label">P1</text>
    <rect x="140" y="225" width="110" height="48" class="blue"/><rect x="250" y="225" width="110" height="48" class="teal"/><rect x="360" y="225" width="110" height="48" class="coral"/><rect x="470" y="225" width="110" height="48" class="purple"/>
    <text x="195" y="256" text-anchor="middle" class="value">5</text><text x="305" y="256" text-anchor="middle" class="value">3</text><text x="415" y="256" text-anchor="middle" class="value">1</text><text x="525" y="256" text-anchor="middle" class="value">2</text>

    <text x="120" y="299" text-anchor="end" class="label">P2</text>
    <rect x="140" y="273" width="110" height="48" class="blue"/><rect x="250" y="273" width="110" height="48" class="teal"/><rect x="360" y="273" width="110" height="48" class="coral"/><rect x="470" y="273" width="110" height="48" class="purple"/>
    <text x="195" y="304" text-anchor="middle" class="value">2</text><text x="305" y="304" text-anchor="middle" class="value">7</text><text x="415" y="304" text-anchor="middle" class="value">4</text><text x="525" y="304" text-anchor="middle" class="value">1</text>

    <text x="120" y="347" text-anchor="end" class="label">P3</text>
    <rect x="140" y="321" width="110" height="48" class="blue"/><rect x="250" y="321" width="110" height="48" class="teal"/><rect x="360" y="321" width="110" height="48" class="coral"/><rect x="470" y="321" width="110" height="48" class="purple"/>
    <text x="195" y="352" text-anchor="middle" class="value">4</text><text x="305" y="352" text-anchor="middle" class="value">1</text><text x="415" y="352" text-anchor="middle" class="value">2</text><text x="525" y="352" text-anchor="middle" class="value">8</text>
  </g>

  <text x="692" y="395" text-anchor="end" class="stage">2 · REDUCE</text>
  <text x="692" y="417" text-anchor="end" class="small">columns in parallel</text>
  <path d="M195 369 V419" class="flow"/><path d="M305 369 V419" class="flow"/><path d="M415 369 V419" class="flow"/><path d="M525 369 V419" class="flow"/>
  <g aria-label="Four independent column sums">
    <rect x="140" y="427" width="110" height="62" rx="9" class="computed blue-stroke"/>
    <text x="195" y="451" text-anchor="middle" class="small">1+5+2+4</text><text x="195" y="478" text-anchor="middle" class="value">= 12</text>
    <rect x="250" y="427" width="110" height="62" rx="9" class="computed teal-stroke"/>
    <text x="305" y="451" text-anchor="middle" class="small">2+3+7+1</text><text x="305" y="478" text-anchor="middle" class="value">= 13</text>
    <rect x="360" y="427" width="110" height="62" rx="9" class="computed coral-stroke"/>
    <text x="415" y="451" text-anchor="middle" class="small">3+1+4+2</text><text x="415" y="478" text-anchor="middle" class="value">= 10</text>
    <rect x="470" y="427" width="110" height="62" rx="9" class="computed purple-stroke"/>
    <text x="525" y="451" text-anchor="middle" class="small">4+2+1+8</text><text x="525" y="478" text-anchor="middle" class="value">= 15</text>
  </g>

  <text x="28" y="519" class="stage">3 · SCATTER</text>
  <text x="28" y="542" class="small">result j → Pⱼ only</text>
  <path d="M195 489 V546" class="flow"/><path d="M305 489 V546" class="flow"/><path d="M415 489 V546" class="flow"/><path d="M525 489 V546" class="flow"/>
  <g aria-label="One reduced slice per process">
    <rect x="140" y="554" width="110" height="58" rx="9" class="computed blue-stroke"/>
    <text x="195" y="578" text-anchor="middle" class="small">P0 receives</text><text x="195" y="603" text-anchor="middle" class="value">12</text>
    <rect x="250" y="554" width="110" height="58" rx="9" class="computed teal-stroke"/>
    <text x="305" y="578" text-anchor="middle" class="small">P1 receives</text><text x="305" y="603" text-anchor="middle" class="value">13</text>
    <rect x="360" y="554" width="110" height="58" rx="9" class="computed coral-stroke"/>
    <text x="415" y="578" text-anchor="middle" class="small">P2 receives</text><text x="415" y="603" text-anchor="middle" class="value">10</text>
    <rect x="470" y="554" width="110" height="58" rx="9" class="computed purple-stroke"/>
    <text x="525" y="578" text-anchor="middle" class="small">P3 receives</text><text x="525" y="603" text-anchor="middle" class="value">15</text>
  </g>

  <rect x="80" y="638" width="560" height="42" rx="10" class="neutral"/>
  <text x="360" y="664" text-anchor="middle" class="label">all-reduce = reduce-scatter + all-gather</text>
  <text x="360" y="693" text-anchor="middle" class="small">No rank owns the complete reduced vector yet.</text>
</svg>
