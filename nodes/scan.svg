<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="'Iowan Old Style',Palatino,Georgia,serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg{fill:#FBFAF7}
      .title{fill:#1B1A17;font-size:16px;font-weight:600}
      .sub{fill:#5A564E;font-size:11.5px;font-style:italic;font-family:sans-serif}
      .rowlab{fill:#8A857C;font-size:11px;font-family:sans-serif;font-style:italic}
      .rank{fill:#8A857C;font-size:11px;font-family:sans-serif}
      .cap{fill:#5A564E;font-size:12px;font-family:sans-serif}
      .lbl{font-size:15px;font-weight:600;font-family:sans-serif}
      .eq{font-size:10px;font-weight:600;font-family:sans-serif}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="430" rx="6"/>

  <text class="title" x="32" y="30">Scan  (inclusive prefix)</text>
  <text class="sub" x="218" y="30">process i receives the reduction of values 0 … i  ·  a running total</text>

  <!-- before: each process holds a value -->
  <text class="rowlab" x="32" y="92">before</text>
  <rect x="68"  y="70" width="84" height="40" rx="6" fill="#534AB7" fill-opacity="0.14" stroke="#534AB7" stroke-width="1.2"/>
  <rect x="228" y="70" width="84" height="40" rx="6" fill="#1D9E75" fill-opacity="0.14" stroke="#1D9E75" stroke-width="1.2"/>
  <rect x="388" y="70" width="84" height="40" rx="6" fill="#D85A30" fill-opacity="0.14" stroke="#D85A30" stroke-width="1.2"/>
  <rect x="548" y="70" width="84" height="40" rx="6" fill="#D4537E" fill-opacity="0.14" stroke="#D4537E" stroke-width="1.2"/>
  <text class="lbl" x="110" y="95" text-anchor="middle" fill="#534AB7">3</text>
  <text class="lbl" x="270" y="95" text-anchor="middle" fill="#1D9E75">5</text>
  <text class="lbl" x="430" y="95" text-anchor="middle" fill="#D85A30">2</text>
  <text class="lbl" x="590" y="95" text-anchor="middle" fill="#D4537E">7</text>
  <text class="rank" x="110" y="126" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="126" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="126" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="126" text-anchor="middle">P3</text>

  <!-- triangular flow: P_i accumulates contributions from sources 0..i -->
  <!-- source P0 (purple) -> i = 0,1,2,3 -->
  <path d="M110 112 L110 286" fill="none" stroke="#534AB7" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <path d="M118 112 L262 286" fill="none" stroke="#534AB7" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <path d="M124 112 L422 286" fill="none" stroke="#534AB7" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <path d="M130 112 L582 286" fill="none" stroke="#534AB7" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <!-- source P1 (teal) -> i = 1,2,3 -->
  <path d="M270 112 L270 286" fill="none" stroke="#1D9E75" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <path d="M280 112 L430 286" fill="none" stroke="#1D9E75" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <path d="M286 112 L590 286" fill="none" stroke="#1D9E75" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <!-- source P2 (coral) -> i = 2,3 -->
  <path d="M430 112 L430 286" fill="none" stroke="#D85A30" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <path d="M440 112 L598 286" fill="none" stroke="#D85A30" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>
  <!-- source P3 (pink) -> i = 3 -->
  <path d="M590 112 L590 286" fill="none" stroke="#D4537E" stroke-width="1.1" opacity="0.45" marker-end="url(#ah)"/>

  <!-- after: each process holds its prefix reduction -->
  <text class="rowlab" x="32" y="312">after</text>
  <rect x="68"  y="290" width="84" height="40" rx="6" fill="#534AB7" fill-opacity="0.14" stroke="#534AB7" stroke-width="1.2"/>
  <rect x="228" y="290" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <rect x="388" y="290" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <rect x="548" y="290" width="84" height="40" rx="6" fill="#BA7517" fill-opacity="0.16" stroke="#BA7517" stroke-width="1.3"/>
  <text class="lbl" x="110" y="315" text-anchor="middle" fill="#534AB7">3</text>
  <text class="lbl" x="270" y="315" text-anchor="middle" fill="#BA7517">8</text>
  <text class="lbl" x="430" y="315" text-anchor="middle" fill="#BA7517">10</text>
  <text class="lbl" x="590" y="315" text-anchor="middle" fill="#BA7517">17</text>

  <!-- prefix equations (the staircase) -->
  <text class="eq" x="110" y="350" text-anchor="middle"><tspan fill="#534AB7">3</tspan></text>
  <text class="eq" x="270" y="350" text-anchor="middle"><tspan fill="#534AB7">3</tspan><tspan fill="#5A564E">+</tspan><tspan fill="#1D9E75">5</tspan><tspan fill="#5A564E">=</tspan><tspan fill="#BA7517">8</tspan></text>
  <text class="eq" x="430" y="350" text-anchor="middle"><tspan fill="#534AB7">3</tspan><tspan fill="#5A564E">+</tspan><tspan fill="#1D9E75">5</tspan><tspan fill="#5A564E">+</tspan><tspan fill="#D85A30">2</tspan><tspan fill="#5A564E">=</tspan><tspan fill="#BA7517">10</tspan></text>
  <text class="eq" x="590" y="350" text-anchor="middle"><tspan fill="#534AB7">3</tspan><tspan fill="#5A564E">+</tspan><tspan fill="#1D9E75">5</tspan><tspan fill="#5A564E">+</tspan><tspan fill="#D85A30">2</tspan><tspan fill="#5A564E">+</tspan><tspan fill="#D4537E">7</tspan><tspan fill="#5A564E">=</tspan><tspan fill="#BA7517">17</tspan></text>
  <text class="rank" x="110" y="372" text-anchor="middle">P0</text>
  <text class="rank" x="270" y="372" text-anchor="middle">P1</text>
  <text class="rank" x="430" y="372" text-anchor="middle">P2</text>
  <text class="rank" x="590" y="372" text-anchor="middle">P3</text>

  <text class="cap" x="340" y="402" text-anchor="middle">P_i combines the values of P0 … P_i (the triangular fan above)  →  a running prefix total.</text>
  <text class="cap" x="340" y="420" text-anchor="middle">P0's prefix is just its own value (purple); the rest are computed (amber). Reduce would give only the last, 17.</text>
</svg>
