<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">SIMT turns scalar thread code into one lockstep warp and handles divergence with masks</title>
  <desc id="desc">The programmer writes scalar code for thread i, and hardware bundles 32 threads into one warp. Cycle 1 issues ADD to all 32 lanes. At a branch where i is less than 16, cycle 2 executes the ADD arm on lanes 0 through 15 while lanes 16 through 31 are masked. Cycle 3 flips the masks and executes SUB on lanes 16 through 31. Cycle 4 reconverges all 32 lanes on the next shared instruction. The divergent branch costs two serialized cycles rather than one aligned cycle.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 15px; fill: #536B7E; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 650; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
      .groupA { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 2.5; }
      .groupB { fill: #FBE3DD; stroke: #D85A30; stroke-width: 2.5; }
      .maskedA { fill: #F5FAF8; stroke: #3F9B86; stroke-width: 2; stroke-dasharray: 7 5; }
      .maskedB { fill: #FCF7F5; stroke: #D85A30; stroke-width: 2; stroke-dasharray: 7 5; }
      .cost { fill: #FFF1C7; stroke: #D89016; stroke-width: 2.5; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#7B8D9B"/></marker>
  </defs>

  <rect width="720" height="700" fill="#FFFFFF"/>
  <text x="28" y="42" class="headline">Write one thread; hardware runs 32 in lockstep</text>
  <text x="28" y="70" class="subtitle">SIMT keeps scalar programming while one warp shares each issued instruction</text>

  <rect x="28" y="94" width="300" height="108" rx="11" class="neutral"/>
  <text x="48" y="120" class="stage">PROGRAMMER WRITES SCALAR CODE</text>
  <text x="48" y="148" class="mono">c[i] = a[i] + b[i]</text>
  <text x="48" y="174" class="mono">if (i &lt; 16) ADD</text>
  <text x="48" y="195" class="mono">else SUB</text>
  <path d="M342 148 H384" class="flow"/>
  <rect x="400" y="94" width="292" height="108" rx="11" class="cost"/>
  <text x="546" y="120" text-anchor="middle" class="stage">HARDWARE BUNDLES THREADS</text>
  <text x="546" y="156" text-anchor="middle" class="headline">32 threads = 1 warp</text>
  <text x="546" y="184" text-anchor="middle" class="small">one instruction · private registers/data</text>

  <text x="310" y="231" text-anchor="middle" class="stage">LANES 0–15 · i&lt;16</text>
  <text x="570" y="231" text-anchor="middle" class="stage">LANES 16–31 · i≥16</text>
  <g aria-label="Four SIMT execution cycles with two lane groups">
    <text x="28" y="266" class="stage">CYCLE 1</text><text x="28" y="289" class="small">ADD · full warp</text>
    <rect x="190" y="245" width="240" height="60" rx="9" class="groupA"/>
    <text x="310" y="269" text-anchor="middle" class="small">ADD active · 16 lanes</text><text x="310" y="294" text-anchor="middle" class="label">i0: 11 … i15: 176</text>
    <rect x="450" y="245" width="240" height="60" rx="9" class="groupB"/>
    <text x="570" y="269" text-anchor="middle" class="small">ADD active · 16 lanes</text><text x="570" y="294" text-anchor="middle" class="label">i16: 187 … i31: 352</text>

    <text x="28" y="346" class="stage">CYCLE 2</text><text x="28" y="369" class="small">branch · ADD arm</text>
    <rect x="190" y="325" width="240" height="60" rx="9" class="groupA"/>
    <text x="310" y="349" text-anchor="middle" class="small">executing ADD arm</text><text x="310" y="374" text-anchor="middle" class="label">i0: 11 … i15: 176</text>
    <rect x="450" y="325" width="240" height="60" rx="9" class="maskedB"/>
    <text x="570" y="349" text-anchor="middle" class="small">MASKED · 16 lanes</text><text x="570" y="374" text-anchor="middle" class="label">ADD result discarded</text>

    <text x="28" y="426" class="stage">CYCLE 3</text><text x="28" y="449" class="small">branch · SUB arm</text>
    <rect x="190" y="405" width="240" height="60" rx="9" class="maskedA"/>
    <text x="310" y="429" text-anchor="middle" class="small">MASKED · 16 lanes</text><text x="310" y="454" text-anchor="middle" class="label">hold prior ADD result</text>
    <rect x="450" y="405" width="240" height="60" rx="9" class="groupB"/>
    <text x="570" y="429" text-anchor="middle" class="small">executing SUB arm</text><text x="570" y="454" text-anchor="middle" class="label">i16: 153 … i31: 288</text>

    <text x="28" y="506" class="stage">CYCLE 4</text><text x="28" y="529" class="small">next instruction</text>
    <rect x="190" y="485" width="240" height="60" rx="9" class="groupA"/>
    <text x="310" y="509" text-anchor="middle" class="small">RECONVERGED</text><text x="310" y="534" text-anchor="middle" class="label">all 16 active</text>
    <rect x="450" y="485" width="240" height="60" rx="9" class="groupB"/>
    <text x="570" y="509" text-anchor="middle" class="small">RECONVERGED</text><text x="570" y="534" text-anchor="middle" class="label">all 16 active</text>
  </g>

  <rect x="54" y="574" width="612" height="54" rx="10" class="cost"/>
  <text x="360" y="598" text-anchor="middle" class="small">divergent branch</text>
  <text x="360" y="620" text-anchor="middle" class="label">ADD arm 1 cycle + SUB arm 1 cycle = 2 serialized cycles</text>
  <rect x="54" y="645" width="612" height="40" rx="10" class="neutral"/>
  <text x="360" y="670" text-anchor="middle" class="label">One instruction per warp cycle; masked lanes no-op, then all 32 reconverge.</text>
</svg>
