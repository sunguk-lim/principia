<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Softmax turns four logits into positive probabilities using one shared sum</title>
  <desc id="desc">The logits 2, 1, 0.1, and minus 1 become exponentials 7.389, 2.718, 1.105, and 0.368. These sum to 11.580. Dividing every exponential by that total produces probabilities 0.638, 0.235, 0.095, and 0.032, which sum to approximately one after rounding.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #536B7E; }
      .stage { font-size: 18px; font-weight: 700; letter-spacing: .6px; }
      .label { font-size: 18px; font-weight: 650; }
      .value { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .small { font-size: 16px; fill: #536B7E; }
      .given { fill: #E2F3EE; stroke: #3F9B86; stroke-width: 2; }
      .computed { fill: #FBE7DF; stroke: #D85A30; stroke-width: 2; }
      .accent { fill: #FFF1C7; stroke: #D89016; stroke-width: 3; }
      .track { fill: #EEF2F5; }
      .bar { fill: #D85A30; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 2; marker-end: url(#arrow); }
      .converge { fill: none; stroke: #D89016; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7B8D9B"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#FFFFFF"/>
  <text x="30" y="42" class="headline">One shared total turns scores into probabilities</text>
  <text x="30" y="70" class="subtitle">Exponentiate every logit, add once, then divide every row by the same sum.</text>

  <text x="102" y="112" text-anchor="middle" class="stage">LOGITS z</text>
  <text x="252" y="112" text-anchor="middle" class="stage">POSITIVE eᶻ</text>
  <text x="601" y="112" text-anchor="middle" class="stage">PROBABILITIES p</text>

  <g aria-label="Four aligned derivation rows">
    <text x="26" y="159" class="small">i=1</text>
    <rect x="64" y="132" width="76" height="42" rx="8" class="given"/><text x="102" y="159" text-anchor="middle" class="value">2</text>
    <path d="M140 153 H196" class="flow"/><text x="168" y="142" text-anchor="middle" class="small">eˣ</text>
    <rect x="204" y="132" width="96" height="42" rx="8" class="computed"/><text x="252" y="159" text-anchor="middle" class="value">7.389</text>
    <path d="M300 153 C338 153 350 225 390 225" class="converge"/>
    <path d="M488 153 H506" class="flow"/>
    <rect x="514" y="132" width="174" height="42" rx="8" class="computed"/>
    <rect x="530" y="146" width="116" height="14" rx="7" class="track"/><rect x="530" y="146" width="74" height="14" rx="7" class="bar"/>
    <text x="674" y="159" text-anchor="end" class="value">0.638</text>

    <text x="26" y="219" class="small">i=2</text>
    <rect x="64" y="192" width="76" height="42" rx="8" class="given"/><text x="102" y="219" text-anchor="middle" class="value">1</text>
    <path d="M140 213 H196" class="flow"/><text x="168" y="202" text-anchor="middle" class="small">eˣ</text>
    <rect x="204" y="192" width="96" height="42" rx="8" class="computed"/><text x="252" y="219" text-anchor="middle" class="value">2.718</text>
    <path d="M300 213 C338 213 350 225 390 225" class="converge"/>
    <path d="M488 213 H506" class="flow"/>
    <rect x="514" y="192" width="174" height="42" rx="8" class="computed"/>
    <rect x="530" y="206" width="116" height="14" rx="7" class="track"/><rect x="530" y="206" width="27" height="14" rx="7" class="bar"/>
    <text x="674" y="219" text-anchor="end" class="value">0.235</text>

    <text x="26" y="279" class="small">i=3</text>
    <rect x="64" y="252" width="76" height="42" rx="8" class="given"/><text x="102" y="279" text-anchor="middle" class="value">0.1</text>
    <path d="M140 273 H196" class="flow"/><text x="168" y="262" text-anchor="middle" class="small">eˣ</text>
    <rect x="204" y="252" width="96" height="42" rx="8" class="computed"/><text x="252" y="279" text-anchor="middle" class="value">1.105</text>
    <path d="M300 273 C338 273 350 225 390 225" class="converge"/>
    <path d="M488 273 H506" class="flow"/>
    <rect x="514" y="252" width="174" height="42" rx="8" class="computed"/>
    <rect x="530" y="266" width="116" height="14" rx="7" class="track"/><rect x="530" y="266" width="11" height="14" rx="6" class="bar"/>
    <text x="674" y="279" text-anchor="end" class="value">0.095</text>

    <text x="26" y="339" class="small">i=4</text>
    <rect x="64" y="312" width="76" height="42" rx="8" class="given"/><text x="102" y="339" text-anchor="middle" class="value">−1</text>
    <path d="M140 333 H196" class="flow"/><text x="168" y="322" text-anchor="middle" class="small">eˣ</text>
    <rect x="204" y="312" width="96" height="42" rx="8" class="computed"/><text x="252" y="339" text-anchor="middle" class="value">0.368</text>
    <path d="M300 333 C338 333 350 225 390 225" class="converge"/>
    <path d="M488 333 H506" class="flow"/>
    <rect x="514" y="312" width="174" height="42" rx="8" class="computed"/>
    <rect x="530" y="326" width="116" height="14" rx="7" class="track"/><rect x="530" y="326" width="4" height="14" rx="2" class="bar"/>
    <text x="674" y="339" text-anchor="end" class="value">0.032</text>
  </g>

  <rect x="390" y="193" width="76" height="64" rx="12" class="accent"/>
  <text x="428" y="217" text-anchor="middle" class="small">Σeᶻ</text>
  <text x="428" y="241" text-anchor="middle" class="value">11.580</text>
  <path d="M466 225 H488 M488 153 V333" fill="none" stroke="#7B8D9B" stroke-width="2"/>
  <text x="488" y="376" text-anchor="middle" class="small">each ÷ 11.580</text>

  <rect x="64" y="390" width="624" height="72" rx="14" class="accent"/>
  <text x="376" y="421" text-anchor="middle" class="label">0.638 + 0.235 + 0.095 + 0.032 ≈ 1.000</text>
  <text x="376" y="448" text-anchor="middle" class="small">One denominator preserves ranking and forces one shared total.</text>

  <text x="64" y="515" class="small">Input logits are unrestricted; exponentials are positive; normalized shares form a distribution.</text>
</svg>
