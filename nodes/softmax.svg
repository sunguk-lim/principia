<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" font-family="'Iowan Old Style',Palatino,Georgia,serif">
  <style>
    .bg{fill:#FBFAF7}
    .vec{fill:#E2F3EE;stroke:#3F9B86;stroke-width:1}
    .cell{fill:#1B1A17;font-size:12px;font-family:sans-serif}
    .lab{fill:#1B1A17;font-weight:600;font-size:14px}
    .note{fill:#5A564E;font-size:11px;font-family:sans-serif}
    .op{fill:#D85A30;font-size:13px;font-family:sans-serif;font-weight:600}
    .arr{stroke:#D85A30;stroke-width:1.5;fill:none}
    .title{fill:#1B1A17;font-size:15px}
  </style>
  <rect class="bg" x="0" y="0" width="480" height="170" rx="6"/>
  <text class="title" x="240" y="28" text-anchor="middle">softmax : logits → probabilities</text>

  <!-- input vector z -->
  <text class="lab" x="92" y="62" text-anchor="middle">z</text>
  <rect class="vec" x="40" y="70" width="104" height="30"/>
  <line x1="66" y1="70" x2="66" y2="100" stroke="#3F9B86" stroke-width="0.5"/>
  <line x1="92" y1="70" x2="92" y2="100" stroke="#3F9B86" stroke-width="0.5"/>
  <line x1="118" y1="70" x2="118" y2="100" stroke="#3F9B86" stroke-width="0.5"/>
  <text class="cell" x="53" y="89" text-anchor="middle">2.0</text>
  <text class="cell" x="79" y="89" text-anchor="middle">1.0</text>
  <text class="cell" x="105" y="89" text-anchor="middle">0.1</text>
  <text class="cell" x="131" y="89" text-anchor="middle">-1</text>
  <text class="note" x="92" y="118" text-anchor="middle">real scores, ℝⁿ</text>

  <!-- arrow -->
  <line class="arr" x1="160" y1="85" x2="300" y2="85" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" class="arr"/></marker></defs>
  <text class="op" x="230" y="78" text-anchor="middle">softmax</text>
  <text class="note" x="230" y="98" text-anchor="middle">eᶻⁱ ÷ Σ eᶻ</text>

  <!-- output vector -->
  <text class="lab" x="368" y="62" text-anchor="middle">softmax(z)</text>
  <rect class="vec" x="316" y="70" width="104" height="30"/>
  <line x1="342" y1="70" x2="342" y2="100" stroke="#3F9B86" stroke-width="0.5"/>
  <line x1="368" y1="70" x2="368" y2="100" stroke="#3F9B86" stroke-width="0.5"/>
  <line x1="394" y1="70" x2="394" y2="100" stroke="#3F9B86" stroke-width="0.5"/>
  <text class="cell" x="329" y="89" text-anchor="middle">.64</text>
  <text class="cell" x="355" y="89" text-anchor="middle">.24</text>
  <text class="cell" x="381" y="89" text-anchor="middle">.10</text>
  <text class="cell" x="407" y="89" text-anchor="middle">.02</text>
  <text class="note" x="368" y="118" text-anchor="middle">probabilities, Σ = 1</text>
</svg>
