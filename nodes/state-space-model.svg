<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">A fixed-size state recurrence and its equivalent convolution produce the same sequence</title>
  <desc id="desc">With A 0.5, B 2, C 3, initial state 0, and inputs 1, 0, and 2, three equal-size state registers become 2, 1, and 4.5. Outputs are 6, 3, and 13.5. The middle output remains nonzero despite a zero input because prior state survives. A convolution kernel 6, 3, and 1.5 independently reproduces the same outputs.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .small { font-size: 15px; fill: #536B7E; }
      .input { fill: #E2F3EE; stroke: #3F9B86; stroke-width: 2; }
      .state { fill: #FBE7DF; stroke: #D85A30; stroke-width: 2.5; }
      .output { fill: #FFF1C7; stroke: #D89016; stroke-width: 2.5; }
      .echo { fill: #FBE7DF; stroke: #D89016; stroke-width: 4; }
      .panel { fill: #FFF9EC; stroke: #C79A3E; stroke-width: 2; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7B8D9B"/></marker>
  </defs>

  <rect width="720" height="700" fill="#FFFFFF"/>
  <text x="28" y="40" class="headline">One fixed-size state carries an unbounded past</text>
  <text x="28" y="67" class="subtitle">Linear recurrence for step-by-step inference · equivalent convolution for parallel training</text>

  <rect x="28" y="88" width="664" height="50" rx="11" class="panel"/>
  <text x="46" y="119" class="label">A=0.5</text><text x="151" y="119" class="label">B=2</text><text x="237" y="119" class="label">C=3</text><text x="323" y="119" class="label">D=0</text>
  <text x="402" y="119" class="small">hₜ = A·hₜ₋₁ + B·xₜ</text><text x="585" y="119" class="small">yₜ = C·hₜ</text>

  <text x="40" y="175" class="stage">RECURRENCE · SAME-SIZE STATE AT EVERY STEP</text>
  <rect x="34" y="205" width="74" height="58" rx="10" class="state"/><text x="71" y="228" text-anchor="middle" class="small">h₀</text><text x="71" y="251" text-anchor="middle" class="value">0</text>
  <path d="M108 234 C128 234 125 340 142 340" class="flow"/>

  <g aria-label="Three recurrence steps">
    <text x="222" y="190" text-anchor="middle" class="stage">STEP 1/3</text>
    <rect x="150" y="205" width="144" height="58" rx="10" class="input"/><text x="222" y="228" text-anchor="middle" class="small">new input x₁</text><text x="222" y="251" text-anchor="middle" class="value">1</text>
    <path d="M222 263 V290" class="flow"/>
    <rect x="142" y="300" width="160" height="80" rx="11" class="state"/><text x="222" y="328" text-anchor="middle" class="small">next state h₁</text><text x="222" y="357" text-anchor="middle" class="value">.5(0)+2(1)=2</text>
    <path d="M222 380 V408" class="flow"/>
    <rect x="158" y="418" width="128" height="58" rx="10" class="output"/><text x="222" y="441" text-anchor="middle" class="small">output y₁</text><text x="222" y="464" text-anchor="middle" class="value">3(2)=6</text>

    <path d="M302 340 H326" class="flow"/>
    <text x="389" y="190" text-anchor="middle" class="stage">STEP 2/3</text>
    <rect x="326" y="205" width="126" height="58" rx="10" class="input"/><text x="389" y="228" text-anchor="middle" class="small">new input x₂</text><text x="389" y="251" text-anchor="middle" class="value">0</text>
    <path d="M389 263 V290" class="flow"/>
    <rect x="309" y="296" width="160" height="88" rx="11" class="echo"/><text x="389" y="327" text-anchor="middle" class="small">h₂ · carried echo</text><text x="389" y="357" text-anchor="middle" class="value">.5(2)+2(0)=1</text>
    <path d="M389 384 V408" class="flow"/>
    <rect x="325" y="418" width="128" height="58" rx="10" class="output"/><text x="389" y="441" text-anchor="middle" class="small">output y₂</text><text x="389" y="464" text-anchor="middle" class="value">3(1)=3</text>

    <path d="M469 340 H493" class="flow"/>
    <text x="564" y="190" text-anchor="middle" class="stage">STEP 3/3</text>
    <rect x="500" y="205" width="128" height="58" rx="10" class="input"/><text x="564" y="228" text-anchor="middle" class="small">new input x₃</text><text x="564" y="251" text-anchor="middle" class="value">2</text>
    <path d="M564 263 V290" class="flow"/>
    <rect x="484" y="300" width="160" height="80" rx="11" class="state"/><text x="564" y="328" text-anchor="middle" class="small">next state h₃</text><text x="564" y="357" text-anchor="middle" class="value">.5(1)+2(2)=4.5</text>
    <path d="M564 380 V408" class="flow"/>
    <rect x="500" y="418" width="128" height="58" rx="10" class="output"/><text x="564" y="441" text-anchor="middle" class="small">output y₃</text><text x="564" y="464" text-anchor="middle" class="value">3(4.5)=13.5</text>
  </g>

  <line x1="28" y1="502" x2="692" y2="502" stroke="#D9E0E5" stroke-width="1.5"/>
  <text x="40" y="535" class="stage">SAME MODEL AS A CONVOLUTION</text>
  <text x="40" y="562" class="small">fixed lag kernel kₖ = C·Aᵏ·B</text>
  <rect x="260" y="536" width="100" height="42" rx="9" class="output"/><text x="310" y="562" text-anchor="middle" class="value">k₀=6</text>
  <rect x="370" y="536" width="100" height="42" rx="9" class="output"/><text x="420" y="562" text-anchor="middle" class="value">k₁=3</text>
  <rect x="480" y="536" width="110" height="42" rx="9" class="output"/><text x="535" y="562" text-anchor="middle" class="value">k₂=1.5</text>

  <rect x="40" y="592" width="640" height="74" rx="12" class="panel"/>
  <text x="58" y="616" class="value">y₁ = 6(1) = 6</text>
  <text x="250" y="616" class="value">y₂ = 6(0)+3(1) = 3</text>
  <text x="470" y="616" class="value">y₃ = 6(2)+3(0)+1.5(1) = 13.5</text>
  <text x="360" y="649" text-anchor="middle" class="label">Both forms produce y = [6, 3, 13.5] · recurrence ⇄ convolution is exact</text>
  <text x="360" y="690" text-anchor="middle" class="small">The state stays the same size at step 3 or step 3,000.</text>
</svg>
