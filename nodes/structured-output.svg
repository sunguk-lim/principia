<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">A grammar mask removes an illegal favorite and preserves preference among legal tokens</title>
  <desc id="desc">At the expect-digit grammar state, five token probabilities are 0.225, 0.083, 0.050, 0.612, and 0.030. The illegal closing brace is the favorite. The mask keeps digits 7 and 4, sets all other logits to negative infinity, and softmax renormalizes the digits to 0.622 and 0.378. Sampling 7 advances the grammar toward a valid closing brace.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .small { font-size: 15px; fill: #536B7E; }
      .state { fill: #FBF0DB; stroke: #C79A3E; stroke-width: 2; }
      .current { fill: #FFF1C7; stroke: #D89016; stroke-width: 4; }
      .legal { fill: #E2F3EE; stroke: #3F9B86; stroke-width: 2; }
      .illegal { fill: #FBE7DF; stroke: #D85A30; stroke-width: 2; }
      .neutral { fill: #F5F7F8; stroke: #A8B3BC; stroke-width: 1.5; }
      .track { fill: #E8EDF1; }
      .legalbar { fill: #3F9B86; }
      .illegalbar { fill: #D85A30; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 2; marker-end: url(#arrow); }
      .advance { fill: none; stroke: #D89016; stroke-width: 4; marker-end: url(#goldArrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7B8D9B"/></marker>
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#D89016"/></marker>
  </defs>

  <rect width="720" height="700" fill="#FFFFFF"/>
  <text x="28" y="40" class="headline">A grammar turns “likely” into “legal and likely”</text>
  <text x="28" y="67" class="subtitle">The model keeps its preference among allowed tokens; forbidden tokens become impossible.</text>

  <g aria-label="Grammar automaton">
    <circle cx="78" cy="124" r="31" class="state"/><text x="78" y="120" text-anchor="middle" class="label">S0</text><text x="78" y="140" text-anchor="middle" class="small">start</text>
    <path d="M110 124 H185" class="flow"/><text x="148" y="111" text-anchor="middle" class="small">{"x":</text>
    <circle cx="219" cy="124" r="37" class="current"/><text x="219" y="119" text-anchor="middle" class="label">S1</text><text x="219" y="140" text-anchor="middle" class="small">expect digit</text>
    <path d="M257 124 H340" class="advance"/><text x="298" y="111" text-anchor="middle" class="small">sample 7</text>
    <circle cx="375" cy="124" r="34" class="state"/><text x="375" y="119" text-anchor="middle" class="label">S2</text><text x="375" y="140" text-anchor="middle" class="small">expect }</text>
    <path d="M410 124 H486" class="flow"/><text x="448" y="111" text-anchor="middle" class="small">}</text>
    <circle cx="520" cy="124" r="31" class="state"/><text x="520" y="120" text-anchor="middle" class="label">S3</text><text x="520" y="140" text-anchor="middle" class="small">valid</text>
    <rect x="575" y="96" width="117" height="56" rx="10" class="legal"/><text x="633" y="119" text-anchor="middle" class="small">output grows</text><text x="633" y="140" text-anchor="middle" class="value">{"x":7</text>
  </g>

  <line x1="28" y1="178" x2="692" y2="178" stroke="#D9E0E5" stroke-width="1.5"/>
  <text x="126" y="211" text-anchor="middle" class="stage">MODEL SCORES</text>
  <text x="360" y="211" text-anchor="middle" class="stage">GRAMMAR MASK</text>
  <text x="592" y="211" text-anchor="middle" class="stage">LEGAL DISTRIBUTION</text>
  <text x="126" y="234" text-anchor="middle" class="small">raw p after softmax</text>
  <text x="360" y="234" text-anchor="middle" class="small">state S1 allows {7, 4}</text>
  <text x="592" y="234" text-anchor="middle" class="small">softmax over survivors</text>

  <path d="M230 243 H260" class="flow"/><path d="M460 243 H490" class="flow"/>

  <g aria-label="Five aligned vocabulary rows">
    <rect x="28" y="252" width="202" height="54" rx="9" class="illegal"/>
    <text x="42" y="284" class="value">{"x":</text><text x="103" y="284" class="small">z=2</text><rect x="143" y="272" width="68" height="12" rx="6" class="track"/><rect x="143" y="272" width="25" height="12" rx="6" class="illegalbar"/><text x="211" y="300" text-anchor="end" class="small">p=.225</text>
    <rect x="260" y="252" width="200" height="54" rx="9" class="illegal"/><text x="278" y="284" class="label">✕ illegal</text><text x="444" y="284" text-anchor="end" class="value">z=−∞</text>
    <rect x="490" y="252" width="202" height="54" rx="9" class="neutral"/><text x="508" y="284" class="small">blocked</text><text x="674" y="284" text-anchor="end" class="value">p=0</text>

    <rect x="28" y="316" width="202" height="54" rx="9" class="legal"/>
    <text x="42" y="348" class="value">7</text><text x="103" y="348" class="small">z=1</text><rect x="143" y="336" width="68" height="12" rx="6" class="track"/><rect x="143" y="336" width="9" height="12" rx="5" class="legalbar"/><text x="211" y="364" text-anchor="end" class="small">p=.083</text>
    <rect x="260" y="316" width="200" height="54" rx="9" class="legal"/><text x="278" y="348" class="label">✓ legal</text><text x="444" y="348" text-anchor="end" class="value">z=1</text>
    <rect x="486" y="312" width="210" height="62" rx="11" fill="#FFF1C7" stroke="#D89016" stroke-width="4"/><text x="506" y="348" class="label">7 · sampled</text><rect x="611" y="336" width="50" height="12" rx="6" class="track"/><rect x="611" y="336" width="31" height="12" rx="6" class="legalbar"/><text x="678" y="365" text-anchor="end" class="value">p=.622</text>

    <rect x="28" y="380" width="202" height="54" rx="9" class="legal"/>
    <text x="42" y="412" class="value">4</text><text x="103" y="412" class="small">z=.5</text><rect x="143" y="400" width="68" height="12" rx="6" class="track"/><rect x="143" y="400" width="6" height="12" rx="3" class="legalbar"/><text x="211" y="428" text-anchor="end" class="small">p=.050</text>
    <rect x="260" y="380" width="200" height="54" rx="9" class="legal"/><text x="278" y="412" class="label">✓ legal</text><text x="444" y="412" text-anchor="end" class="value">z=.5</text>
    <rect x="490" y="380" width="202" height="54" rx="9" class="legal"/><text x="508" y="412" class="label">4</text><rect x="572" y="400" width="76" height="12" rx="6" class="track"/><rect x="572" y="400" width="29" height="12" rx="6" class="legalbar"/><text x="678" y="428" text-anchor="end" class="value">p=.378</text>

    <rect x="28" y="444" width="202" height="54" rx="9" class="illegal"/>
    <text x="42" y="476" class="value">}</text><text x="103" y="476" class="small">z=3</text><rect x="143" y="464" width="68" height="12" rx="6" class="track"/><rect x="143" y="464" width="68" height="12" rx="6" class="illegalbar"/><text x="211" y="492" text-anchor="end" class="small">p=.612</text>
    <rect x="260" y="444" width="200" height="54" rx="9" class="illegal"/><text x="278" y="476" class="label">✕ illegal</text><text x="444" y="476" text-anchor="end" class="value">z=−∞</text>
    <rect x="490" y="444" width="202" height="54" rx="9" class="neutral"/><text x="508" y="476" class="small">blocked</text><text x="674" y="476" text-anchor="end" class="value">p=0</text>

    <rect x="28" y="508" width="202" height="54" rx="9" class="illegal"/>
    <text x="42" y="540" class="value">cat</text><text x="103" y="540" class="small">z=0</text><rect x="143" y="528" width="68" height="12" rx="6" class="track"/><rect x="143" y="528" width="3" height="12" rx="2" class="illegalbar"/><text x="211" y="556" text-anchor="end" class="small">p=.030</text>
    <rect x="260" y="508" width="200" height="54" rx="9" class="illegal"/><text x="278" y="540" class="label">✕ illegal</text><text x="444" y="540" text-anchor="end" class="value">z=−∞</text>
    <rect x="490" y="508" width="202" height="54" rx="9" class="neutral"/><text x="508" y="540" class="small">blocked</text><text x="674" y="540" text-anchor="end" class="value">p=0</text>
  </g>

  <rect x="28" y="588" width="664" height="84" rx="14" fill="#FFF8E8" stroke="#D89016" stroke-width="2.5"/>
  <text x="360" y="618" text-anchor="middle" class="label">Illegal favorite: } · 0.612 → 0</text>
  <text x="360" y="645" text-anchor="middle" class="label">Legal preference survives: 7 &gt; 4 · 0.622 + 0.378 = 1</text>
  <text x="360" y="665" text-anchor="middle" class="small">The grammar changes what is possible—not which legal option the model prefers.</text>
</svg>
