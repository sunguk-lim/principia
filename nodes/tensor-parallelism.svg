<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
  <title id="title">Tensor parallelism matches column shards of A with row shards of B and communicates once</title>
  <desc id="desc">A 4 by 8 matrix A is split into four 4 by 2 column shards across GPUs 0 through 3. Replicated X produces four local 1 by 2 Y shards. Elementwise GeLU needs no communication. An 8 by 4 matrix B is split into matching 2 by 4 row shards. Each GPU produces a full-shaped 1 by 4 partial Z. One SUM all-reduce combines the four partials into the true 1 by 4 Z, identical to the unsharded result.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 17px; font-weight: 700; letter-spacing: .4px; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 16px; font-weight: 650; }
      .small { font-size: 15px; fill: #536B7E; }
      .blue { fill: #DDEAFF; stroke: #3977B8; stroke-width: 2; }
      .teal { fill: #DDF3EE; stroke: #3F9B86; stroke-width: 2; }
      .coral { fill: #FBE3DD; stroke: #D85A30; stroke-width: 2; }
      .purple { fill: #EEE4FA; stroke: #7A5CB0; stroke-width: 2; }
      .neutral { fill: #F3F5F6; stroke: #9BA8B2; stroke-width: 1.5; }
      .accent { fill: #FFF1C7; stroke: #D89016; stroke-width: 3; }
      .grid { stroke: #FFFFFF; stroke-width: 1; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7B8D9B"/></marker>
  </defs>

  <rect width="720" height="680" fill="#FFFFFF"/>
  <text x="28" y="40" class="headline">Split two matrices; communicate once</text>
  <text x="28" y="67" class="subtitle">Column-shard A · local GeLU · row-shard B · SUM the full-shaped partials</text>
  <rect x="28" y="84" width="664" height="46" rx="10" class="neutral"/>
  <text x="46" y="112" class="small">Reference on one GPU:</text><text x="210" y="112" class="label">Z = GeLU(X(1×4) · A(4×8)) · B(8×4) → Z(1×4)</text>

  <text x="28" y="163" class="stage">1 · A SPLIT BY COLUMNS</text>
  <text x="28" y="187" class="small">X(1×4) is replicated to every GPU</text>
  <g aria-label="A 4 by 8 matrix split into four column shards">
    <rect x="60" y="204" width="120" height="80" class="blue"/><rect x="180" y="204" width="120" height="80" class="teal"/><rect x="300" y="204" width="120" height="80" class="coral"/><rect x="420" y="204" width="120" height="80" class="purple"/>
    <path d="M120 204 V284 M240 204 V284 M360 204 V284 M480 204 V284" class="grid"/>
    <path d="M60 224 H540 M60 244 H540 M60 264 H540" class="grid"/>
    <text x="120" y="222" text-anchor="middle" class="value">A₀</text><text x="240" y="222" text-anchor="middle" class="value">A₁</text><text x="360" y="222" text-anchor="middle" class="value">A₂</text><text x="480" y="222" text-anchor="middle" class="value">A₃</text>
  </g>
  <text x="612" y="239" text-anchor="middle" class="label">A(4×8)</text>
  <text x="612" y="261" text-anchor="middle" class="small">four Aᵢ(4×2)</text>

  <g aria-label="Local Y shards">
    <path d="M120 284 V299" class="flow"/><rect x="68" y="307" width="104" height="40" rx="8" class="blue"/><text x="120" y="332" text-anchor="middle" class="value">Y₀ 1×2</text>
    <path d="M240 284 V299" class="flow"/><rect x="188" y="307" width="104" height="40" rx="8" class="teal"/><text x="240" y="332" text-anchor="middle" class="value">Y₁ 1×2</text>
    <path d="M360 284 V299" class="flow"/><rect x="308" y="307" width="104" height="40" rx="8" class="coral"/><text x="360" y="332" text-anchor="middle" class="value">Y₂ 1×2</text>
    <path d="M480 284 V299" class="flow"/><rect x="428" y="307" width="104" height="40" rx="8" class="purple"/><text x="480" y="332" text-anchor="middle" class="value">Y₃ 1×2</text>
  </g>
  <text x="612" y="321" text-anchor="middle" class="label">local X·Aᵢ</text>
  <rect x="60" y="360" width="480" height="38" rx="9" class="accent"/><text x="300" y="384" text-anchor="middle" class="label">local GeLU · no communication</text>

  <text x="28" y="425" class="stage">2 · MATCHING B SPLIT BY ROWS</text>
  <g aria-label="B 8 by 4 matrix split into four row shards">
    <rect x="60" y="442" width="160" height="36" class="blue"/><rect x="60" y="478" width="160" height="36" class="teal"/><rect x="60" y="514" width="160" height="36" class="coral"/><rect x="60" y="550" width="160" height="36" class="purple"/>
    <path d="M100 442 V586 M140 442 V586 M180 442 V586" class="grid"/><path d="M60 460 H220 M60 496 H220 M60 532 H220 M60 568 H220" class="grid"/>
    <text x="140" y="466" text-anchor="middle" class="value">B₀ 2×4</text><text x="140" y="502" text-anchor="middle" class="value">B₁ 2×4</text><text x="140" y="538" text-anchor="middle" class="value">B₂ 2×4</text><text x="140" y="574" text-anchor="middle" class="value">B₃ 2×4</text>
  </g>
  <text x="140" y="610" text-anchor="middle" class="small">B(8×4) · matching hidden shards</text>

  <g aria-label="Four full-shaped partial outputs">
    <path d="M220 460 H278" class="flow"/><rect x="288" y="442" width="154" height="36" rx="7" class="blue"/><text x="365" y="466" text-anchor="middle" class="value">Z₀ partial · 1×4</text>
    <path d="M220 496 H278" class="flow"/><rect x="288" y="478" width="154" height="36" rx="7" class="teal"/><text x="365" y="502" text-anchor="middle" class="value">Z₁ partial · 1×4</text>
    <path d="M220 532 H278" class="flow"/><rect x="288" y="514" width="154" height="36" rx="7" class="coral"/><text x="365" y="538" text-anchor="middle" class="value">Z₂ partial · 1×4</text>
    <path d="M220 568 H278" class="flow"/><rect x="288" y="550" width="154" height="36" rx="7" class="purple"/><text x="365" y="574" text-anchor="middle" class="value">Z₃ partial · 1×4</text>
  </g>
  <text x="365" y="610" text-anchor="middle" class="small">full output shape · incomplete value</text>

  <path d="M442 460 C485 460 485 510 520 514 M442 496 C485 496 485 510 520 514 M442 532 C485 532 485 518 520 514 M442 568 C485 568 485 518 520 514" fill="none" stroke="#7B8D9B" stroke-width="2"/>
  <rect x="520" y="476" width="172" height="76" rx="12" class="accent"/><text x="606" y="502" text-anchor="middle" class="small">one SUM all-reduce</text><text x="606" y="528" text-anchor="middle" class="label">Z = Z₀+Z₁+Z₂+Z₃</text><text x="606" y="547" text-anchor="middle" class="small">true Z · 1×4</text>

  <rect x="270" y="628" width="422" height="40" rx="9" class="neutral"/><text x="481" y="653" text-anchor="middle" class="label">Local paths stay independent until one all-reduce.</text>
</svg>
