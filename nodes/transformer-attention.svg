<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 195" width="580" height="195" font-family="'Iowan Old Style',Palatino,Georgia,serif">
  <style>
    .bg{fill:#FBFAF7}
    .mat{fill:#FBF0DB;stroke:#C79A3E;stroke-width:1}
    .grid{stroke:#C79A3E;stroke-width:0.5}
    .op{fill:#D85A30;font-size:18px;font-weight:600}
    .name{fill:#1B1A17;font-weight:600;font-size:13px}
    .dim{fill:#2F6FB5;font-style:italic;font-size:11px;font-family:sans-serif}
    .note{fill:#5A564E;font-size:10px;font-family:sans-serif}
    .arr{stroke:#D85A30;stroke-width:1.5;fill:none}
    .title{fill:#1B1A17;font-size:15px}
    .leg{fill:#2F6FB5;font-size:11px;font-style:italic;font-family:sans-serif}
  </style>
  <rect class="bg" x="0" y="0" width="580" height="195" rx="6"/>
  <text class="title" x="290" y="20" text-anchor="middle">Attention = softmax(QKᵀ / √dₖ) · V</text>
  <text class="leg" x="290" y="38" text-anchor="middle">drawn to scale:  n ≫ dₖ,  so QKᵀ is a big n×n matrix</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" class="arr"/></marker></defs>

  <!-- Q : n×dk  (tall, narrow: 2 col × 8 row) -->
  <rect class="mat" x="28" y="48" width="26" height="104"/>
  <line class="grid" x1="41" y1="48" x2="41" y2="152"/>
  <line class="grid" x1="28" y1="61" x2="54" y2="61"/><line class="grid" x1="28" y1="74" x2="54" y2="74"/><line class="grid" x1="28" y1="87" x2="54" y2="87"/><line class="grid" x1="28" y1="100" x2="54" y2="100"/><line class="grid" x1="28" y1="113" x2="54" y2="113"/><line class="grid" x1="28" y1="126" x2="54" y2="126"/><line class="grid" x1="28" y1="139" x2="54" y2="139"/>
  <text class="name" x="41" y="166" text-anchor="middle">Q</text>
  <text class="dim" x="41" y="179" text-anchor="middle">n×dₖ</text>

  <text class="op" x="64" y="106" text-anchor="middle">·</text>

  <!-- Kᵀ : dk×n  (flat, wide: 8 col × 2 row) -->
  <rect class="mat" x="76" y="87" width="104" height="26"/>
  <line class="grid" x1="89" y1="87" x2="89" y2="113"/><line class="grid" x1="102" y1="87" x2="102" y2="113"/><line class="grid" x1="115" y1="87" x2="115" y2="113"/><line class="grid" x1="128" y1="87" x2="128" y2="113"/><line class="grid" x1="141" y1="87" x2="141" y2="113"/><line class="grid" x1="154" y1="87" x2="154" y2="113"/><line class="grid" x1="167" y1="87" x2="167" y2="113"/>
  <line class="grid" x1="76" y1="100" x2="180" y2="100"/>
  <text class="name" x="128" y="166" text-anchor="middle">Kᵀ</text>
  <text class="dim" x="128" y="179" text-anchor="middle">dₖ×n</text>

  <text class="op" x="192" y="106" text-anchor="middle">=</text>

  <!-- S = QKᵀ : n×n  (big square 8×8) -->
  <rect class="mat" x="206" y="48" width="104" height="104"/>
  <line class="grid" x1="219" y1="48" x2="219" y2="152"/><line class="grid" x1="232" y1="48" x2="232" y2="152"/><line class="grid" x1="245" y1="48" x2="245" y2="152"/><line class="grid" x1="258" y1="48" x2="258" y2="152"/><line class="grid" x1="271" y1="48" x2="271" y2="152"/><line class="grid" x1="284" y1="48" x2="284" y2="152"/><line class="grid" x1="297" y1="48" x2="297" y2="152"/>
  <line class="grid" x1="206" y1="61" x2="310" y2="61"/><line class="grid" x1="206" y1="74" x2="310" y2="74"/><line class="grid" x1="206" y1="87" x2="310" y2="87"/><line class="grid" x1="206" y1="100" x2="310" y2="100"/><line class="grid" x1="206" y1="113" x2="310" y2="113"/><line class="grid" x1="206" y1="126" x2="310" y2="126"/><line class="grid" x1="206" y1="139" x2="310" y2="139"/>
  <text class="name" x="258" y="166" text-anchor="middle">QKᵀ</text>
  <text class="dim" x="258" y="179" text-anchor="middle">n×n</text>

  <!-- arrow: softmax -->
  <line class="arr" x1="318" y1="100" x2="354" y2="100" marker-end="url(#a)"/>
  <text class="note" x="336" y="66" text-anchor="middle">softmax</text>
  <text class="note" x="336" y="128" text-anchor="middle">÷√dₖ</text>

  <!-- P : n×n  (big square 8×8) -->
  <rect class="mat" x="362" y="48" width="104" height="104"/>
  <line class="grid" x1="375" y1="48" x2="375" y2="152"/><line class="grid" x1="388" y1="48" x2="388" y2="152"/><line class="grid" x1="401" y1="48" x2="401" y2="152"/><line class="grid" x1="414" y1="48" x2="414" y2="152"/><line class="grid" x1="427" y1="48" x2="427" y2="152"/><line class="grid" x1="440" y1="48" x2="440" y2="152"/><line class="grid" x1="453" y1="48" x2="453" y2="152"/>
  <line class="grid" x1="362" y1="61" x2="466" y2="61"/><line class="grid" x1="362" y1="74" x2="466" y2="74"/><line class="grid" x1="362" y1="87" x2="466" y2="87"/><line class="grid" x1="362" y1="100" x2="466" y2="100"/><line class="grid" x1="362" y1="113" x2="466" y2="113"/><line class="grid" x1="362" y1="126" x2="466" y2="126"/><line class="grid" x1="362" y1="139" x2="466" y2="139"/>
  <text class="name" x="414" y="166" text-anchor="middle">P</text>
  <text class="dim" x="414" y="179" text-anchor="middle">n×n</text>

  <text class="op" x="478" y="106" text-anchor="middle">·</text>

  <!-- V : n×d_v  (tall, narrow) -->
  <rect class="mat" x="490" y="48" width="26" height="104"/>
  <line class="grid" x1="503" y1="48" x2="503" y2="152"/>
  <line class="grid" x1="490" y1="61" x2="516" y2="61"/><line class="grid" x1="490" y1="74" x2="516" y2="74"/><line class="grid" x1="490" y1="87" x2="516" y2="87"/><line class="grid" x1="490" y1="100" x2="516" y2="100"/><line class="grid" x1="490" y1="113" x2="516" y2="113"/><line class="grid" x1="490" y1="126" x2="516" y2="126"/><line class="grid" x1="490" y1="139" x2="516" y2="139"/>
  <text class="name" x="503" y="166" text-anchor="middle">V</text>
  <text class="dim" x="503" y="179" text-anchor="middle">n×d_v</text>

  <text class="op" x="526" y="106" text-anchor="middle">=</text>

  <!-- O : n×d_v  (tall, narrow) -->
  <rect class="mat" x="538" y="48" width="26" height="104"/>
  <line class="grid" x1="551" y1="48" x2="551" y2="152"/>
  <line class="grid" x1="538" y1="61" x2="564" y2="61"/><line class="grid" x1="538" y1="74" x2="564" y2="74"/><line class="grid" x1="538" y1="87" x2="564" y2="87"/><line class="grid" x1="538" y1="100" x2="564" y2="100"/><line class="grid" x1="538" y1="113" x2="564" y2="113"/><line class="grid" x1="538" y1="126" x2="564" y2="126"/><line class="grid" x1="538" y1="139" x2="564" y2="139"/>
  <text class="name" x="551" y="166" text-anchor="middle">O</text>
  <text class="dim" x="551" y="179" text-anchor="middle">n×d_v</text>
</svg>
