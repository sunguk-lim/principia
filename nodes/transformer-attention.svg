<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
  <title id="title">One attention row turns query-key matches into a weighted mixture of value vectors</title>
  <desc id="desc">A compact tensor pipeline shows Q times K transpose producing an n by n score matrix, row softmax producing weights P, and P times V producing an n by d-v output. One query row has scaled scores log 0.1, log 0.7, and log 0.2, which softmax converts to weights 0.1, 0.7, and 0.2. Applied to value vectors 1 comma 0, 0 comma 1, and 1 comma 1, these produce contextual output 0.3 comma 0.9.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183047; }
      .headline { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #536B7E; }
      .stage { font-size: 17px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .value { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .small { font-size: 15px; fill: #536B7E; }
      .matrix { fill: #FBF0DB; stroke: #C79A3E; stroke-width: 2; }
      .blue { fill: #E7F1FF; stroke: #3977B8; stroke-width: 2; }
      .teal { fill: #E2F3EE; stroke: #3F9B86; stroke-width: 2; }
      .purple { fill: #F0E9FA; stroke: #7A5CB0; stroke-width: 2; }
      .accent { fill: #FFF1C7; stroke: #D89016; stroke-width: 3; }
      .flow { fill: none; stroke: #7B8D9B; stroke-width: 2; marker-end: url(#arrow); }
      .bflow { fill: none; stroke: #3977B8; marker-end: url(#blueArrow); }
      .tflow { fill: none; stroke: #3F9B86; marker-end: url(#tealArrow); }
      .pflow { fill: none; stroke: #7A5CB0; marker-end: url(#purpleArrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7B8D9B"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#3977B8"/></marker>
    <marker id="tealArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#3F9B86"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7A5CB0"/></marker>
  </defs>

  <rect width="720" height="650" fill="#FFFFFF"/>
  <text x="28" y="40" class="headline">Attention mixes values according to query–key matches</text>
  <text x="28" y="67" class="subtitle">Trace one query row: similarities become weights; weights decide how much of each value survives.</text>

  <g aria-label="Full tensor shape pipeline">
    <text x="28" y="100" class="stage">FULL TENSOR SHAPES</text>
    <rect x="28" y="116" width="70" height="64" rx="8" class="matrix"/><text x="63" y="145" text-anchor="middle" class="label">Q</text><text x="63" y="167" text-anchor="middle" class="small">n×dₖ</text>
    <text x="111" y="154" class="label">·</text>
    <rect x="130" y="128" width="82" height="40" rx="8" class="matrix"/><text x="171" y="146" text-anchor="middle" class="label">Kᵀ</text><text x="171" y="164" text-anchor="middle" class="small">dₖ×n</text>
    <path d="M220 148 H250" class="flow"/>
    <rect x="258" y="116" width="78" height="64" rx="8" class="matrix"/><text x="297" y="145" text-anchor="middle" class="label">scores</text><text x="297" y="167" text-anchor="middle" class="small">n×n</text>
    <path d="M344 148 H378" class="flow"/><text x="361" y="132" text-anchor="middle" class="small">row</text><text x="361" y="177" text-anchor="middle" class="small">softmax</text>
    <rect x="386" y="116" width="70" height="64" rx="8" class="matrix"/><text x="421" y="145" text-anchor="middle" class="label">P</text><text x="421" y="167" text-anchor="middle" class="small">n×n</text>
    <text x="469" y="154" class="label">·</text>
    <rect x="488" y="116" width="70" height="64" rx="8" class="matrix"/><text x="523" y="145" text-anchor="middle" class="label">V</text><text x="523" y="167" text-anchor="middle" class="small">n×dᵥ</text>
    <path d="M566 148 H600" class="flow"/>
    <rect x="608" y="116" width="84" height="64" rx="8" class="accent"/><text x="650" y="145" text-anchor="middle" class="label">O</text><text x="650" y="167" text-anchor="middle" class="small">n×dᵥ</text>
  </g>

  <line x1="28" y1="205" x2="692" y2="205" stroke="#D9E0E5" stroke-width="1.5"/>
  <text x="28" y="238" class="stage">ONE QUERY ROW</text>
  <text x="28" y="263" class="subtitle">Scaled q·k scores</text>
  <text x="100" y="289" text-anchor="middle" class="small">position 1</text><text x="270" y="289" text-anchor="middle" class="small">position 2</text><text x="440" y="289" text-anchor="middle" class="small">position 3</text>

  <rect x="45" y="302" width="110" height="44" rx="9" class="blue"/><text x="100" y="329" text-anchor="middle" class="value">ln(.1)</text>
  <rect x="215" y="302" width="110" height="44" rx="9" class="teal"/><text x="270" y="329" text-anchor="middle" class="value">ln(.7)</text>
  <rect x="385" y="302" width="110" height="44" rx="9" class="purple"/><text x="440" y="329" text-anchor="middle" class="value">ln(.2)</text>
  <path d="M270 346 V384" class="flow"/><text x="300" y="372" class="small">row softmax</text>

  <text x="28" y="383" class="subtitle">Weights · positive and sum to 1</text>
  <rect x="45" y="396" width="110" height="44" rx="9" class="blue"/><text x="100" y="423" text-anchor="middle" class="value">0.1</text>
  <rect x="215" y="396" width="110" height="44" rx="9" class="teal"/><text x="270" y="423" text-anchor="middle" class="value">0.7</text>
  <rect x="385" y="396" width="110" height="44" rx="9" class="purple"/><text x="440" y="423" text-anchor="middle" class="value">0.2</text>
  <rect x="530" y="396" width="142" height="44" rx="9" class="matrix"/><text x="601" y="423" text-anchor="middle" class="value">0.1+0.7+0.2=1</text>

  <text x="28" y="478" class="subtitle">Aligned value vectors</text>
  <g aria-label="Three two-component value vectors">
    <rect x="45" y="492" width="54" height="44" rx="8" class="blue"/><rect x="101" y="492" width="54" height="44" rx="8" class="blue"/><text x="72" y="519" text-anchor="middle" class="value">1</text><text x="128" y="519" text-anchor="middle" class="value">0</text>
    <rect x="215" y="492" width="54" height="44" rx="8" class="teal"/><rect x="271" y="492" width="54" height="44" rx="8" class="teal"/><text x="242" y="519" text-anchor="middle" class="value">0</text><text x="298" y="519" text-anchor="middle" class="value">1</text>
    <rect x="385" y="492" width="54" height="44" rx="8" class="purple"/><rect x="441" y="492" width="54" height="44" rx="8" class="purple"/><text x="412" y="519" text-anchor="middle" class="value">1</text><text x="468" y="519" text-anchor="middle" class="value">1</text>
  </g>

  <path d="M100 440 V480" class="bflow" stroke-width="2"/><path d="M270 440 V480" class="tflow" stroke-width="6"/><path d="M440 440 V480" class="pflow" stroke-width="3"/>
  <path d="M100 538 C100 570 510 570 540 584" class="bflow" stroke-width="2"/>
  <path d="M270 538 C270 562 510 562 540 584" class="tflow" stroke-width="6"/>
  <path d="M440 538 C440 554 510 554 540 584" class="pflow" stroke-width="3"/>

  <text x="28" y="586" class="value">0.1[1,0] + 0.7[0,1] + 0.2[1,1]</text>
  <text x="442" y="586" class="label">=</text>
  <rect x="540" y="558" width="70" height="50" rx="10" class="accent"/><rect x="612" y="558" width="70" height="50" rx="10" class="accent"/><text x="575" y="589" text-anchor="middle" class="value">0.3</text><text x="647" y="589" text-anchor="middle" class="value">0.9</text>
  <text x="611" y="630" text-anchor="middle" class="small">context-aware output row</text>
  <text x="28" y="630" class="small">component check: [0.1+0+0.2, 0+0.7+0.2] = [0.3, 0.9]</text>
</svg>
