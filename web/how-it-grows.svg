<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How the graph grows: a concept enters as a root and grows its prerequisite tree toward axioms; a second concept grows its own tree but reuses an already-existing prerequisite (the gold shared node).">
  <!-- Standalone mirror of the viewer's #lifecycleSvg (web/graph.template.html, "How it grows"
       help pane). White card baked in so the dark text reads in both GitHub light/dark themes. -->
  <rect x="0.5" y="0.5" width="639" height="379" rx="10" fill="#ffffff" stroke="#dde3ee"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3656" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">a closed-world concept graph — trees share prerequisites</text>
  <!-- action call-outs (the mechanism driving each phase) -->
  <text x="320" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#2f6fe0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" opacity="0">scaffold + sync<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.08;0.42;0.45;1" dur="10s" repeatCount="indefinite"/></text>
  <text x="320" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#2f6fe0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" opacity="0">scaffold + sync<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.49;0.64;0.66;1" dur="10s" repeatCount="indefinite"/></text>
  <text x="320" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#c98a00" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" opacity="0">lock · reuse<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.69;1" dur="10s" repeatCount="indefinite"/></text>
  <!-- tree-1 edges -->
  <line x1="135" y1="72" x2="75"  y2="185" stroke="#9aa7c2" stroke-width="3" stroke-dasharray="128" stroke-dashoffset="128"><animate attributeName="stroke-dashoffset" values="128;128;0;0" keyTimes="0;0.10;0.16;1" dur="10s" repeatCount="indefinite"/></line>
  <line x1="135" y1="72" x2="300" y2="185" stroke="#9aa7c2" stroke-width="3" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;200;0;0" keyTimes="0;0.10;0.16;1" dur="10s" repeatCount="indefinite"/></line>
  <line x1="75"  y1="185" x2="75"  y2="292" stroke="#9aa7c2" stroke-width="3" stroke-dasharray="107" stroke-dashoffset="107"><animate attributeName="stroke-dashoffset" values="107;107;0;0" keyTimes="0;0.20;0.26;1" dur="10s" repeatCount="indefinite"/></line>
  <line x1="300" y1="185" x2="300" y2="292" stroke="#9aa7c2" stroke-width="3" stroke-dasharray="107" stroke-dashoffset="107"><animate attributeName="stroke-dashoffset" values="107;107;0;0" keyTimes="0;0.20;0.26;1" dur="10s" repeatCount="indefinite"/></line>
  <!-- tree-2 edges -->
  <line x1="510" y1="72" x2="575" y2="185" stroke="#9aa7c2" stroke-width="3" stroke-dasharray="130" stroke-dashoffset="130"><animate attributeName="stroke-dashoffset" values="130;130;0;0" keyTimes="0;0.50;0.56;1" dur="10s" repeatCount="indefinite"/></line>
  <line x1="575" y1="185" x2="575" y2="292" stroke="#9aa7c2" stroke-width="3" stroke-dasharray="107" stroke-dashoffset="107"><animate attributeName="stroke-dashoffset" values="107;107;0;0" keyTimes="0;0.58;0.64;1" dur="10s" repeatCount="indefinite"/></line>
  <!-- reuse edge: tree-2 root → shared depth-2 node -->
  <line x1="510" y1="72" x2="300" y2="185" stroke="#e0a800" stroke-width="3.5" stroke-dasharray="239" stroke-dashoffset="239"><animate attributeName="stroke-dashoffset" values="239;239;0;0" keyTimes="0;0.68;0.75;1" dur="10s" repeatCount="indefinite"/></line>
  <!-- tree-1 nodes -->
  <circle cx="135" cy="72" r="0" fill="#4a82f0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.05;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;30;24;24" keyTimes="0;0.04;0.08;0.12;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="75"  cy="185" r="0" fill="#7ba8f5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.15;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;20;16;16" keyTimes="0;0.14;0.18;0.22;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="75"  cy="292" r="0" fill="#b9d2ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.25;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;16;12;12" keyTimes="0;0.24;0.28;0.32;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="292" r="0" fill="#b9d2ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.25;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;16;12;12" keyTimes="0;0.24;0.28;0.32;1" dur="10s" repeatCount="indefinite"/></circle>
  <!-- SHARED node at depth 2 (turns gold when tree-2 reuses it) -->
  <circle cx="300" cy="185" r="0" fill="#b9c2d6" stroke="#b8860b" stroke-width="0" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.15;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;23;18;18" keyTimes="0;0.14;0.18;0.22;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#b9c2d6;#b9c2d6;#f6bd16;#f6bd16" keyTimes="0;0.68;0.74;1" dur="10s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="0;0;0;4;4" keyTimes="0;0.67;0.69;0.74;1" dur="10s" repeatCount="indefinite"/></circle>
  <!-- tree-2 nodes -->
  <circle cx="510" cy="72" r="0" fill="#25b48a" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.47;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;30;24;24" keyTimes="0;0.46;0.50;0.54;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="575" cy="185" r="0" fill="#5fcaa8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.55;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;20;16;16" keyTimes="0;0.54;0.58;0.62;1" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="575" cy="292" r="0" fill="#aee6d4" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.63;1" dur="10s" repeatCount="indefinite"/><animate attributeName="r" values="0;0;16;12;12" keyTimes="0;0.62;0.66;0.70;1" dur="10s" repeatCount="indefinite"/></circle>
  <!-- depth labels -->
  <text x="624" y="76"  text-anchor="end" font-size="11" fill="#aeb8cc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">depth 1 · root</text>
  <text x="624" y="189" text-anchor="end" font-size="11" fill="#aeb8cc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">depth 2</text>
  <text x="624" y="296" text-anchor="end" font-size="11" fill="#aeb8cc" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">depth 3 · axioms</text>
  <!-- captions -->
  <text x="320" y="366" text-anchor="middle" font-size="14" fill="#51607a" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" opacity="0">(1) a concept grows its prerequisite tree — 3 levels, toward axioms<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06;0.10;0.42;0.45;1" dur="10s" repeatCount="indefinite"/></text>
  <text x="320" y="366" text-anchor="middle" font-size="14" fill="#51607a" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" opacity="0">(2) a second concept grows its own tree<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.50;0.63;0.65;1" dur="10s" repeatCount="indefinite"/></text>
  <text x="320" y="366" text-anchor="middle" font-size="14" fill="#a06a00" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" opacity="0">(3) ...reusing a depth-2 node from the first (shared prerequisite)<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.74;1" dur="10s" repeatCount="indefinite"/></text>
</svg>
